name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Enforce immutable GitHub Actions dependencies
        run: python scripts/security/validate_actions_pins.py
      - name: Skill and runtime source security scan
        run: |
          mkdir -p .tmp
          python scripts/security/scan_skills.py --report .tmp/skill-security-report.json
          python -m unittest discover -s scripts/security/tests -p 'test_*.py'
      - name: Validate and report capability declarations
        run: |
          python scripts/capabilities/validate_contract.py --report .tmp/capability-assessment-report.json
          python -m unittest discover -s scripts/capabilities/tests -p 'test_*.py'
      - name: Generate static routing collision signals
        run: python scripts/eval/routing_collision_report.py --output .tmp/routing-collision-report.json
      - name: Upload skill security scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-hardening-static-reports
          path: |
            .tmp/skill-security-report.json
            .tmp/capability-assessment-report.json
            .tmp/routing-collision-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Historical P0 backlog structural audit
        run: |
          python scripts/roadmap/audit_p0.py --output .tmp/p0-backlog-audit.json
          python -m unittest discover -s scripts/roadmap/tests -p 'test_*.py'
      - name: Archive P0 inventory receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-backlog-structural-audit
          path: .tmp/p0-backlog-audit.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Skill development change-class regression
        run: |
          python -m unittest discover -s scripts/engineering/tests -p 'test_*.py'
          python scripts/engineering/change_gate.py --change-class DOCS --path docs/TESTING.md --output .tmp/docs-change-gate.json
      - name: Lab lifecycle compliance audit (54 source skills)
        run: |
          mkdir -p .tmp
          python scripts/engineering/audit_skill_lifecycle.py --output .tmp/skill-lifecycle-audit.json --fail-on-structural-blockers
          python -m unittest discover -s scripts/engineering/tests -p 'test_*.py'
      - name: Upload lifecycle audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-factory-lifecycle-audit
          path: .tmp/skill-lifecycle-audit.json
          if-no-files-found: error
          retention-days: 60
      - name: Audit registered workflow lifecycle contracts
        run: |
          mkdir -p .tmp
          python scripts/engineering/audit_workflow_lifecycle.py --output .tmp/workflow-lifecycle-audit.json
          python -m unittest discover -s scripts/engineering/tests -p 'test_audit_workflow_lifecycle.py'
      - name: Archive workflow audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-factory-workflow-lifecycle-audit
          path: .tmp/workflow-lifecycle-audit.json
          if-no-files-found: error
          retention-days: 60
      - name: Static validation
        run: python scripts/validate/validate_all.py
      - name: Validator mutation tests
        run: python -m unittest discover -s scripts/validate/tests -p 'test_*.py'
      - name: Output policy router deterministic unit tests
        run: python -m unittest discover -s scripts/output/tests -p 'test_*.py'
      - name: Eval isolation, evidence and runtime campaign tests
        run: |
          python scripts/eval/validate_isolation.py
          python scripts/eval/campaign.py validate
          python scripts/eval/skill_release_campaign.py validate
          python -m unittest discover -s scripts/eval/tests -p 'test_*.py'
          python scripts/eval/campaign.py prepare --output .tmp/runtime-campaign-r19
          python scripts/eval/campaign.py validate-evidence
      - name: Assemble executor-only runtime retest pack
        run: |
          mkdir -p .tmp/runtime-retest-pack/executor-inputs
          cp -R .tmp/runtime-campaign-r19/production-plugin .tmp/runtime-retest-pack/production
          cp -R .tmp/runtime-campaign-r19/lab-plugin .tmp/runtime-retest-pack/lab
          cp .tmp/runtime-campaign-r19/lock.json .tmp/runtime-retest-pack/lock.json
          cp .tmp/runtime-campaign-r19/smoke-production-template.json .tmp/runtime-retest-pack/smoke-production-template.json
          cp .tmp/runtime-campaign-r19/smoke-lab-template.json .tmp/runtime-retest-pack/smoke-lab-template.json
          cp evals/campaigns/runtime-validation-2026-10-r2/fallback/fallback-strategy-production-002.input.md .tmp/runtime-retest-pack/executor-inputs/01-fallback-strategy-explicit.input.md
          if find .tmp/runtime-retest-pack -type f \( -name '*.rubric.yaml' -o -name '*.rubric.yml' \) | grep -q .; then
            echo "rubric leaked into executor pack"
            exit 1
          fi
      - name: Upload executor-only runtime retest pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-retest-pack-r19
          path: .tmp/runtime-retest-pack
          if-no-files-found: error
          retention-days: 14
      - name: Packaging safety and reproducibility tests
        run: python -m unittest discover -s scripts/package/tests -p 'test_*.py'
      - name: Commerce calculator tests
        run: python -m unittest discover -s skills/commerce/economics/unit-economics-review/tests -p 'test_*.py'
      - name: Production readiness registry
        run: |
          python -m unittest discover -s scripts/readiness/tests -p 'test_*.py'
          python -m unittest discover -s scripts/release/tests -p 'test_*.py'
          python scripts/readiness/validate_readiness.py
      - name: Verify generated catalog is current
        run: |
          python scripts/catalog/generate_catalog.py
          git diff --exit-code -- CATALOG.md docs/catalog.json
      - name: Build production plugin
        run: python scripts/package/build_plugin.py --maturity production --output .tmp/plugin
      - name: Validate production plugin
        run: python scripts/package/artifact_validation.py .tmp/plugin
      - name: Build mobile-safe skills-only plugin
        run: |
          python scripts/package/build_plugin.py \
            --runtime-mode skills-only --output .tmp/chat-mobile-plugin
          python scripts/package/artifact_validation.py .tmp/chat-mobile-plugin
      - name: Build remote MCP packaging profile
        run: |
          python scripts/package/build_plugin.py \
            --runtime-mode remote \
            --remote-mcp-url https://mcp.example.invalid/mcp \
            --output .tmp/chat-web-plugin
          python scripts/package/artifact_validation.py .tmp/chat-web-plugin
      - name: Build isolated Lab
        run: python scripts/package/build_lab_plugin.py --output .tmp/lab
      - name: Validate Lab and rubric isolation
        run: |
          python scripts/package/artifact_validation.py .tmp/lab --lab
          python scripts/eval/validate_isolation.py --artifact .tmp/lab
      - name: Prepare isolated skill-release-review runtime campaign
        run: python scripts/eval/skill_release_campaign.py prepare --lab .tmp/lab --output .tmp/runtime-campaign-skill-release-review
      - name: Upload skill-release-review runtime campaign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-campaign-skill-release-review
          path: .tmp/runtime-campaign-skill-release-review
          if-no-files-found: error
          retention-days: 14
      - name: Build ChatGPT ZIP channel
        run: python scripts/package/build_chatgpt_skills.py --maturity production --output .tmp/chatgpt-skills
      - name: Validate ZIP channel
        run: python scripts/package/artifact_validation.py .tmp/chatgpt-skills --zips
      - name: Rebuild ZIP channel and compare bytes
        run: |
          cp -R .tmp/chatgpt-skills .tmp/chatgpt-skills-first
          python scripts/package/build_chatgpt_skills.py --maturity production --output .tmp/chatgpt-skills
          diff -qr .tmp/chatgpt-skills-first .tmp/chatgpt-skills
      - name: Runtime eval status
        run: echo "Provider runtime is not claimed by this offline gate; see evals/results/runtime-status.yaml."
