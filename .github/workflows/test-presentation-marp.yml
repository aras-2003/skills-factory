name: Presentation Marp adapter

on:
  pull_request:
    paths:
      - 'adapters/presentation-marp/**'
      - 'docs/presentations/**'
      - 'scripts/validate/presentation_model.py'
      - '.github/workflows/test-presentation-marp.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/presentation-marp/**'
      - 'docs/presentations/**'
      - 'scripts/validate/presentation_model.py'
      - '.github/workflows/test-presentation-marp.yml'

permissions:
  contents: read

concurrency:
  group: presentation-marp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  SF_MARP_IMAGE: ghcr.io/skills-factory/presentation-marp:1.0.0
  SF_MARP_BASE_IMAGE: skills-factory/marp-base:v4.5.1-no-libreoffice
  SF_MARP_NO_BROWSER_IMAGE: skills-factory/marp-base:v4.5.1-no-browser

jobs:
  adapter-runtime:
    name: Marp exports, reopen, security and fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - uses: ./.github/actions/python-environment
        with:
          install-dev-dependencies: "true"
      - name: Build pinned renderer and missing-LibreOffice fixture images
        run: |
          docker build --pull -f adapters/presentation-marp/docker/Dockerfile \
            -t "$SF_MARP_IMAGE" adapters/presentation-marp
          docker build --pull -f adapters/presentation-marp/docker/Dockerfile.no-libreoffice \
            -t "$SF_MARP_BASE_IMAGE" adapters/presentation-marp
          docker image inspect "$SF_MARP_IMAGE" --format '{{.Id}}'
          docker image inspect "$SF_MARP_BASE_IMAGE" --format '{{.Id}}'
          docker build --pull -f adapters/presentation-marp/docker/Dockerfile.no-browser \
            -t "$SF_MARP_NO_BROWSER_IMAGE" adapters/presentation-marp
          docker image inspect "$SF_MARP_NO_BROWSER_IMAGE" --format '{{.Id}}'
          docker pull --quiet ghcr.io/marp-team/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
      - name: Run adapter unit and input security tests
        working-directory: adapters/presentation-marp
        run: node --test
      - name: Validate fixture with the canonical DeckSpec validator
        run: python scripts/validate/presentation_model.py adapters/presentation-marp/fixtures/canonical-deck-v1.json
      - name: Verify missing LibreOffice fails without mode downgrade
        working-directory: adapters/presentation-marp
        run: node scripts/assert-no-libreoffice.mjs
      - name: Verify missing browser blocks browser-backed modes
        working-directory: adapters/presentation-marp
        run: node scripts/assert-missing-runtime.mjs
      - name: Probe Chromium CLI print-to-PDF with blank synthetic HTML
        continue-on-error: true
        run: node adapters/presentation-marp/scripts/diagnose-chrome-cli-print.mjs presentation-marp-evidence/chrome-cli-print
      - name: Diagnose Puppeteer PDF path in custom renderer
        continue-on-error: true
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-custom
      - name: Probe base64 PDF response on synthetic HTML
        continue-on-error: true
        env:
          SF_PDF_TRANSFER_MODE: base64
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-base64
      - name: Probe full Chrome headless PDF on synthetic HTML
        continue-on-error: true
        env:
          SF_PUPPETEER_HEADLESS_MODE: chrome
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-headless-chrome
      - name: Probe Firefox WebDriver BiDi PDF on synthetic HTML
        continue-on-error: true
        env:
          SF_PUPPETEER_BROWSER: firefox
          SF_CHROME_TMPFS_EXEC: "1"
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-firefox
      - name: Diagnose Puppeteer PDF path in upstream image
        continue-on-error: true
        env:
          SF_MARP_IMAGE: ghcr.io/marp-team/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-upstream
      - name: Compare Puppeteer PDF with executable temporary mount (synthetic only)
        continue-on-error: true
        env:
          SF_CHROME_TMPFS_EXEC: "1"
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-tmpfs-exec
      - name: Compare Puppeteer PDF with Chrome sandbox enabled (synthetic only)
        continue-on-error: true
        env:
          SF_CHROME_SANDBOX: "1"
        run: node adapters/presentation-marp/scripts/diagnose-puppeteer-print.mjs presentation-marp-evidence/puppeteer-print-sandbox
      - name: Diagnose Marp PDF path in custom renderer
        continue-on-error: true
        run: node adapters/presentation-marp/scripts/diagnose-marp-pdf.mjs presentation-marp-evidence/pdf-diagnostic-custom
      - name: Diagnose Marp PDF path in upstream image
        continue-on-error: true
        env:
          SF_MARP_IMAGE: ghcr.io/marp-team/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        run: node adapters/presentation-marp/scripts/diagnose-marp-pdf.mjs presentation-marp-evidence/pdf-diagnostic-upstream
      - name: Diagnose editable Marp path in upstream image
        continue-on-error: true
        env:
          SF_MARP_IMAGE: ghcr.io/marp-team/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        run: timeout --signal=TERM --kill-after=10s 180s node adapters/presentation-marp/scripts/assert-base-editable.mjs presentation-marp-evidence/upstream-editable
      - name: Probe editable Marp export with Firefox WebDriver BiDi
        continue-on-error: true
        env:
          SF_MARP_BROWSER: firefox
          SF_MARP_BROWSER_PROTOCOL: webdriver-bidi
          SF_MARP_TMPFS_EXEC: "1"
        run: timeout --signal=TERM --kill-after=10s 180s node adapters/presentation-marp/scripts/assert-base-editable.mjs presentation-marp-evidence/firefox-editable
      - name: Verify base Marp editable runtime
        run: node adapters/presentation-marp/scripts/assert-base-editable.mjs presentation-marp-evidence/base-editable
      - name: Isolate editable export from fixture complexity
        run: node adapters/presentation-marp/scripts/assert-minimal-editable.mjs presentation-marp-evidence/minimal-editable
      - name: Generate, reopen and inspect all output modes
        run: node adapters/presentation-marp/scripts/integration.mjs presentation-marp-evidence
      - name: Run theme, layout, responsive and editable-safe regression
        run: node adapters/presentation-marp/scripts/theme-regression.mjs presentation-marp-evidence/theme-regression
      - name: Run report-composer and visual-output-design unchanged-domain probes
        run: >-
          python -m unittest
          scripts.validate.tests.test_integrated_reporting.IntegratedReportingTests.test_external_artifact_is_opt_in_not_fallback
          scripts.validate.tests.test_integrated_reporting.IntegratedReportingTests.test_required_visuals_fail_closed_without_renderer
      - name: Validate mixed diagram, chart, table and SVG fallback fixture
        env:
          SF_MARP_FIXTURE: adapters/presentation-marp/fixtures/pres06-mixed.json
        run: |
          python scripts/validate/presentation_model.py adapters/presentation-marp/fixtures/pres06-mixed.json
          node adapters/presentation-marp/scripts/integration.mjs presentation-marp-evidence/pres06-mixed
          node adapters/presentation-marp/scripts/assert-pres06-evidence.mjs adapters/presentation-marp/fixtures/pres06-mixed.json presentation-marp-evidence/pres06-mixed
      - name: Validate PRES-07 reference fixture and cross-format outputs
        env:
          SF_MARP_FIXTURE: adapters/presentation-marp/fixtures/pres07-cross-format-v1.json
        run: |
          python scripts/validate/presentation_model.py "$SF_MARP_FIXTURE"
          node adapters/presentation-marp/scripts/integration.mjs presentation-marp-evidence/pres07-cross-format
          node adapters/presentation-marp/scripts/assert-pres07-evidence.mjs "$SF_MARP_FIXTURE" presentation-marp-evidence/pres07-cross-format
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sf-presentation-marp-${{ env.SOURCE_REVISION }}
          path: presentation-marp-evidence/
          if-no-files-found: ignore
          retention-days: 90
