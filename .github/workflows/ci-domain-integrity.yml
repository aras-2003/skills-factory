name: Domain integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate source contracts
        run: python scripts/validate/validate_all.py
      - name: Validate natural-routing fixtures
        run: python scripts/eval/validate_routing.py
      - name: Output policy router deterministic unit tests
        run: python -m unittest discover -s scripts/output/tests -p 'test_*.py'
      - name: Eval protocol tests
        run: python -m unittest discover -s scripts/eval/tests -p "test_*.py"
      - name: Unit-economics calculator tests
        run: python -m unittest discover -s skills/commerce/economics/unit-economics-review/tests -p "test_*.py"
