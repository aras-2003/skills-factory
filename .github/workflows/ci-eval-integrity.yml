name: Skills Factory Evaluation CI

on:
  pull_request:
    branches: [main, production]
    paths:
      - "evals/**"
      - "scripts/eval/**"
      - "scripts/package/build_lab_plugin.py"
      - ".github/workflows/ci-eval-integrity.yml"

permissions:
  contents: read

jobs:
  eval-integrity:
    name: Evaluation / Isolation, test suite and Lab build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate input/rubric isolation
        run: python scripts/eval/validate_isolation.py
      - name: Run eval protocol unit tests
        run: python -m unittest discover -s scripts/eval/tests -p "test_*.py"
      - name: Build lab artifact in temporary path
        run: python scripts/package/build_lab_plugin.py --output .tmp/skills-factory-lab
      - name: Verify built artifact contains no rubrics
        run: python scripts/eval/validate_isolation.py --artifact .tmp/skills-factory-lab
