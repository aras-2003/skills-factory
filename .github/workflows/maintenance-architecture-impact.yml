name: Skills Factory / Architecture Impact sync
on:
  pull_request:
    paths:
      - 'scripts/governance/sync_task_architecture.py'
      - 'docs/governance/task-architecture-impact-2026-11.json'
      - 'tests/governance/test_task_architecture_sync.py'
      - '.github/workflows/maintenance-architecture-impact.yml'
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      apply:
        description: "Write Project Architecture Impact field (false = dry-run)"
        required: true
        type: boolean
        default: false
      issue_number:
        description: "Existing Issue number; 0 = full manifest"
        required: true
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: architecture-impact-sync-${{ github.event_name == 'issues' && 'control' || (github.event_name == 'workflow_dispatch' && (inputs.issue_number || 'all') || 'pr') }}
  cancel-in-progress: false
jobs:
  validate:
    name: Governance / Test Architecture Impact manifest and synchronization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests/governance -p 'test_task_architecture_sync.py' -v
      - run: python3 scripts/governance/sync_task_architecture.py --check
  sync:
    name: Governance / Sync native Architecture Impact
    if: >-
      github.repository == 'aras-2003/skills-factory' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.number == 688 &&
        github.actor == 'aras-2003' &&
        (contains(github.event.issue.body, '<!-- architecture-impact-sync: dry-run -->') != contains(github.event.issue.body, '<!-- architecture-impact-sync: apply -->'))))

    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
      PROJECT_OWNER: aras-2003
      PROJECT_NUMBER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail closed when project credential is absent
        run: |
          test -n "$GH_TOKEN" || { echo "::error::PROJECTS_TOKEN required"; exit 1; }
      - name: Preview or synchronize existing Project items
        env:
          REQUEST_APPLY: ${{ inputs.apply }}
          REQUEST_ISSUE: ${{ inputs.issue_number }}
          APPROVED_CONTROL_APPLY: ${{ github.event_name == 'issues' && contains(github.event.issue.body, '<!-- architecture-impact-sync: apply -->') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            args=(--issue-number 0)
            if [ "$APPROVED_CONTROL_APPLY" = "true" ]; then args+=(--apply); fi
          else
            args=(--issue-number "${REQUEST_ISSUE:-0}")
            if [ "$REQUEST_APPLY" = "true" ]; then args+=(--apply); fi
          fi
          python3 scripts/governance/sync_task_architecture.py "${args[@]}"
