name: ARC-03 adapter checks

on:
  pull_request:
    paths:
      - 'scripts/architecture/**'
      - 'tests/architecture/**'
      - 'docs/architecture/archify/**'
      - '.github/workflows/ci-archify-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: ARC-03 / Isolated renderer and boundary tests
    timeout-minutes: 25
    env:
      ARCHIFY_SHA: 208acba8d412335185b2056fedf54b3405df43fb
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout and run unit/security contract tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest discover -s tests/architecture -p 'test_*.py' -v
      - name: Fetch and install exact Archify source without lifecycle scripts
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tt-a1i/archify.git "$RUNNER_TEMP/archify-upstream"
          git -C "$RUNNER_TEMP/archify-upstream" checkout --detach "$ARCHIFY_SHA"
          test "$(git -C "$RUNNER_TEMP/archify-upstream" rev-parse HEAD)" = "$ARCHIFY_SHA"
          test "$(git -C "$RUNNER_TEMP/archify-upstream" hash-object "$RUNNER_TEMP/archify-upstream/archify/package-lock.json")" = "e6187b907edc8459f47fe31455539700f2d8e796"
          npm ci --prefix "$RUNNER_TEMP/archify-upstream" --ignore-scripts --no-fund
          npm ci --prefix "$RUNNER_TEMP/archify-upstream/archify" --ignore-scripts --no-fund
          npm audit --prefix "$RUNNER_TEMP/archify-upstream" --audit-level=high
          npm audit --prefix "$RUNNER_TEMP/archify-upstream/archify" --audit-level=high
      - name: Pull the pinned browser/runtime sandbox image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$PLAYWRIGHT_IMAGE"
          docker image inspect "$PLAYWRIGHT_IMAGE" >/dev/null
      - name: Execute source-backed render in the isolated container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arc03-output"
          PYTHONPATH=. python3 scripts/architecture/run_archify_adapter_smoke.py --upstream "$RUNNER_TEMP/archify-upstream" --output-dir "$RUNNER_TEMP/arc03-output"
      - name: Execute exact-source Skills Factory Explorer render
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arc04-output"
          PYTHONPATH=. python3 scripts/architecture/run_skills_factory_explorer_smoke.py --upstream "$RUNNER_TEMP/archify-upstream" --output-dir "$RUNNER_TEMP/arc04-output"
      - name: Archive exact renderer and sandbox receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc03-isolated-render-${{ github.sha }}
          path: |
            ${{ runner.temp }}/arc03-output/*
          if-no-files-found: ignore
          retention-days: 30
