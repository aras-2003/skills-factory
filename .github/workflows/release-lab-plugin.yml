name: Skills Factory / Lab packaging

on:
  push:
    branches: [main]
    paths-ignore:
      - "plugins/skills-factory-lab/**"
      - "docs/lab-release.json"
      - "release/package.yaml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: main-lab-packaging
  cancel-in-progress: false

jobs:
  package:
    name: Release / Build, validate and prepare Lab Marketplace PR
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Bump Lab package patch version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("release/package.yaml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          in_lab = False
          for index, line in enumerate(lines):
              if line.strip() == "lab:":
                  in_lab = True
                  continue
              if in_lab and line and not line[0].isspace():
                  break
              if in_lab and line.startswith("  version:"):
                  raw_version = line.split(":", 1)[1].strip().strip("\\\"").strip("'")
                  parts = raw_version.split(".")
                  if len(parts) != 3 or not all(part.isdigit() for part in parts):
                      raise SystemExit(f"Invalid lab.version: {raw_version}")
                  major, minor, patch = map(int, parts)
                  updated = f"{major}.{minor}.{patch + 1}"
                  value_start = line.index(raw_version)
                  lines[index] = line[:value_start] + updated + line[value_start + len(raw_version):]
                  path.write_text("".join(lines), encoding="utf-8")
                  print(f"Lab package version: {major}.{minor}.{patch} -> {updated}")
                  break
          else:
              raise SystemExit("Could not locate lab.version in release/package.yaml")
          PY
      - name: Build and validate isolated Lab
        run: |
          python scripts/package/build_lab_plugin.py --output plugins/skills-factory-lab
          python scripts/package/artifact_validation.py plugins/skills-factory-lab --lab
          python scripts/eval/validate_isolation.py --artifact plugins/skills-factory-lab
          cp plugins/skills-factory-lab/release-manifest.json docs/lab-release.json
      - name: Upload immutable Lab candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-factory-lab-${{ github.sha }}
          path: |
            plugins/skills-factory-lab
            docs/lab-release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Record candidate identity
        run: |
          echo "## Lab candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source revision: $SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release ID: $(python -c 'import json; print(json.load(open("docs/lab-release.json"))["release_id"])')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package digest: $(python -c 'import json; print(json.load(open("docs/lab-release.json"))["payload_content_sha256"])')" >> "$GITHUB_STEP_SUMMARY"
      - name: Open Marketplace package PR and dispatch validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$SOURCE_REVISION" ]]; then
            echo "::notice::main advanced from $SOURCE_REVISION to $current_main; skipping stale package PR."
            exit 0
          fi

          branch="automation/lab-marketplace-$SOURCE_REVISION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch --track -C "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi

          git add release/package.yaml plugins/skills-factory-lab docs/lab-release.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(lab): publish candidate $SOURCE_REVISION"
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected working tree changes while preparing Lab package PR."
            exit 1
          fi
          remote_head="$(git rev-parse "origin/$branch" 2>/dev/null || true)"
          if [[ "$(git rev-parse HEAD)" != "$remote_head" ]]; then
            git push origin "HEAD:refs/heads/$branch"
          fi

          pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create --base main --head "$branch" --title "chore(lab): publish candidate $SOURCE_REVISION" --body "Generated from exact main source revision $SOURCE_REVISION after Lab package and isolation validation. This PR updates the Marketplace package snapshot and release receipt. It does not publish the Site."
            pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')"
          fi

          gh workflow run ci-validate.yml --ref "$branch"
          gh workflow run ci-domain-integrity.yml --ref "$branch"
          echo "Opened/reused Lab Marketplace PR #$pr_number from $branch and dispatched candidate validation."
