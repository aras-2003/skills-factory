name: Validate production promotion

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: production-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate promotion source and package provenance
        run: |
          python scripts/validate/validate_all.py
          python -m unittest discover -s scripts/validate/tests -p "test_*.py"
          python -m unittest discover -s scripts/eval/tests -p "test_*.py"
          python -m unittest discover -s scripts/package/tests -p "test_*.py"
          python -m unittest discover -s scripts/readiness/tests -p "test_*.py"
          python -m unittest discover -s scripts/release/tests -p "test_*.py"
          python scripts/readiness/validate_readiness.py
          python scripts/package/artifact_validation.py plugins/skills-factory
          python scripts/package/artifact_validation.py dist/chatgpt-skills --zips
          python scripts/release/validate_promotion.py
