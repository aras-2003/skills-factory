name: Python environment
description: Set up the pinned Python version and install locked dependencies, caching only when dependencies are installed.
inputs:
  install-dev-dependencies:
    description: Install the repository's hash-locked development dependencies.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up cached Python 3.12
      if: inputs.install-dev-dependencies == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - name: Set up lightweight Python 3.12
      if: inputs.install-dev-dependencies != 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - name: Install hash-locked dependencies
      if: inputs.install-dev-dependencies == 'true'
      shell: bash
      run: python -m pip install --require-hashes -r requirements-dev.lock
