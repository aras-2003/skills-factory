name: Python environment
description: Set up the pinned Python version and reuse the hash-locked dependency cache.
inputs:
  install-dev-dependencies:
    description: Install the repository's hash-locked development dependencies.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - name: Install hash-locked dependencies
      if: inputs.install-dev-dependencies == 'true'
      shell: bash
      run: python -m pip install --require-hashes -r requirements-dev.lock
