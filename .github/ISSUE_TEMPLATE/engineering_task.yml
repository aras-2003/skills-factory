name: Engineering task (TDC v1.2)
description: Implementation or design task with readable priority, size, area, status and verifiable acceptance
title: "[TASK] "
body:
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options: [DISCOVERY, DESIGN, IMPLEMENT, VALIDATE, EPIC]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "Choose the importance: P0 Critical (blocks a critical path or addresses high-impact risk); P1 High (important dependency); P2 Planned (follows higher priorities); P3 Optional (exploratory or lower priority). Priority is not failure severity."
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "Estimate effort: XS tiny, S one focused change, M one bounded deliverable, L several components, XL multiple workstreams or an umbrella. Split L/XL into bounded S/M slices before locking an iteration."
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Primary owner or product area. Choose Other when the work is cross-domain and has no clearer single owner.
      options: [Engineering, Runtime, "E2E & Quality", Security, Commerce, Investing, OAF, Learning, Strategy, Other]
    validations:
      required: true
  - type: dropdown
    id: project_status
    attributes:
      label: Project status
      description: "Choose the status supported by evidence. Ready requires a locked iteration, clear acceptance, dependencies, owner and tests; new unscheduled work normally starts in Backlog or Discovery."
      options: [Backlog, Discovery, Ready, "In progress", "In review", Verification, Done]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / evidence
      description: Observed gap and consequence, not an unverified solution
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline / existing capability
      description: Verified source/commit/contracts, reuse possibilities and unknowns
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective / deliverable
      description: One bounded observable result (EPIC links child results)
    validations:
      required: true
  - type: textarea
    id: change_description
    attributes:
      label: Opis zmiany — perspektywa architektoniczna
      description: "Explain the current design, proposed change, affected parts, compatibility and tests in plain language. Set Architecture Impact in the native GitHub Projects field after the issue is added: A0 no runtime/contract change; A1 internal change; A2 compatible capability extension; A3 interface or cross-component change; A4 domain-boundary or runtime redesign. The body text does not set that field."
      placeholder: |
        Architektura obecna:
        Opis planowanej zmiany:
        Komponenty/interfejsy/dane objęte wpływem:
        Elementy pozostające bez zmian:
        Decyzja reuse/extend/compose i uzasadnienie:
        Weryfikacja kompatybilności / rollback:
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / exclusions
      description: In and out, with forbidden changes
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs / dependencies
      description: Source files, fixtures, linked Issues and prerequisites
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and test mapping
      description: "AC-01 → T-01: input, objective assertion, expected evidence; distinguish offline/CI/runtime"
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Blockers / failure handling
      description: Missing evidence, decisions, escalation and next action
    validations:
      required: true
