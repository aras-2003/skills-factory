name: Bug / regression
description: Reproducible behavior with evidence and environment
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: iteration
    attributes:
      label: Discovery iteration / tracking issue
      description: Report bugs to the current iteration even after scope freeze; triage decides fixes or accepted deferral.
  - type: input
    id: contract
    attributes:
      label: Violated contract / acceptance criterion
      description: Link frozen acceptance, an existing behavior contract or regression; distinguish from a new desired capability.
  - type: input
    id: legacy
    attributes:
      label: Historical ID / related issue
      description: e.g. E2E-05; include existing issue/PR links
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Include test case, URL or receipt, source revision, runtime version and surface; never include secrets
  - type: dropdown
    id: architecture_level
    attributes:
      label: Architecture impact level
      description: Assess actual affected contracts (A0/A1/A2/A3/A4), UNKNOWN until inspected
      options: [UNKNOWN, A0, A1, A2, A3, A4]
    validations:
      required: true
  - type: textarea
    id: architecture_impact
    attributes:
      label: Architecture Impact
      description: Existing and affected components/contracts, whether architecture changes, target delta, consumer regressions and rollback; see TDC v1.1
      placeholder: |
        Architecture change YES/NO/TO_CONFIRM:
        Baseline and affected interfaces:
        Target delta and unchanged contracts:
        Dependent regression / rollback:
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact / risk / constraints
