schema_version: "1.0"
cases:
  - id: iter08-kpi-trigger-boundaries
    expected_issue: 308
    case_paths:
      - skills/investing/security-underwriting/tests/cases.yaml
      - skills/investing/thesis-monitor/tests/cases.yaml
    required_cases:
      - underwriting-kpi-trigger-matrix
      - monitor-kpi-threshold-crossing-no-trade
      - monitor-verified-kill-criterion-escalates
      - monitor-price-only-no-thesis-invalidation
      - monitor-draft-only
    assertions:
      - each material assumption has a source-backed definition, verified baseline and predeclared measurement window/threshold or NOT_SET
      - action class MONITOR/REVIEW/ESCALATE remains distinct from approved kill criteria and trade authorization
      - missing ACTIVE thesis blocks; no invented persistence, surrogate baseline or automatic invalidation
      - price movement alone does not invalidate business thesis
  - id: iter08-expectations-bridge
    expected_issue: 309
    case_paths:
      - skills/investing/security-underwriting/tests/cases.yaml
      - skills/investing/thesis-monitor/tests/cases.yaml
      - skills/investing/valuation-scenario-review/tests/cases.yaml
    required_cases:
      - underwriting-expectations-bridge-no-lookahead
      - monitor-expectations-bridge-historical
      - monitor-analysis-without-write-authorization
      - valuation-consensus-actual-guidance-bridge
      - valuation-card-no-lookahead
      - valuation-stale-consensus-revisions
    assertions:
      - expectation snapshots, revisions, reported actuals and guidance retain dates, sources, periods and definitions
      - missing, stale, conflicted and future-published inputs remain UNKNOWN/N/M or are excluded from the as-of view
      - original operating assumptions are evaluated separately from multiple changes and stock return
      - observed price movement is separated from uncertain causal attribution
      - no write occurs without exact authorization and observed success receipt
  - id: iter08-methodology-router
    expected_issue: 310
    case_paths:
      - workflows/investment-os-review/tests/cases.yaml
      - adapters/skills-factory-cloud-next/tests/contracts.test.ts
      - evals/campaigns/iteration-08-investing-monitoring-2026-11/runtime-cases.yaml
    required_cases:
      - router-positive-methodology-audit-incidental-ticker-en
      - router-positive-methodology-audit-incidental-ticker-pl
      - router-positive-process-audit-polish-synonym
      - router-positive-security-review-neighbor
      - 310-EN
      - 310-PL
      - 310-SEC
      - 310-NOWRITE
      - shared-portfolio
      - shared-education
    assertions:
      - incidental ticker remains subordinate to explicit workflow/methodology audit intent
      - explicit single-security decision still routes to security review
      - route receipt does not claim child execution
      - process audit does not cause unnecessary canonical portfolio reads or writes
      - Polish and English behavior is equivalent
