schema_version: "1.0"
campaign: skill-engineering-2026-10
purpose: repository-validation-and-runtime-input-registration
out_of_scope_behavior_paths:
  - skills/meta/skill-authoring/SKILL.md
  - skills/meta/skill-test-design/SKILL.md
  - skills/meta/skill-evaluation/SKILL.md
  - workflows/skill-development/WORKFLOW.md
  - release/package.yaml
runtime_targets:
  skill-authoring:
    version: "1.0.2"
    required_cases:
      - authoring-essential-provider-unavailable
      - authoring-conflicting-brief
      - authoring-source-artifact-missing
  skill-test-design:
    version: "0.3.1"
    required_cases:
      - testdesign-description-only-routing
      - testdesign-live-source-evidence
      - testdesign-meta-contract-boundary-pl
      - testdesign-commerce-opportunity-en
      - testdesign-consumer-purchase-nearmiss-pl
      - testdesign-article-factcheck-pl
      - testdesign-article-edit-nearmiss-en
  skill-evaluation:
    version: "0.3.7"
    required_cases:
      - evaluation-queued-not-run
      - evaluation-contradictory-no-steps-pass
      - evaluation-live-browser-blocked
repository_workflow:
  path: workflows/skill-development/WORKFLOW.md
  test_cases: workflows/skill-development/tests/cases.yaml
  minimum_cases: 2
package:
  lab_version_source: release/package.yaml#lab.version
  required_draft_targets:
    - skill-test-design
    - skill-evaluation
    - skill-release-review
