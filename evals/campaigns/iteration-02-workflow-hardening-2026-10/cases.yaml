{
  "schema_version": "1.0",
  "kind": "workflow_hardening_source_cases",
  "cases": [
    {
      "id": "oaf-strategy-execution-reset-positive",
      "workflow": "oaf-strategy-execution-reset",
      "dimension": "positive",
      "input": "Our strategic outcomes are disconnected from funding, capability ownership and portfolio governance. Diagnose a bounded reset.",
      "expected": {
        "should_trigger": true,
        "must": [
          "trace outcomes to capabilities and funding",
          "show unknowns"
        ],
        "must_not": [
          "invent ownership"
        ]
      }
    },
    {
      "id": "oaf-strategy-execution-reset-read-only",
      "workflow": "oaf-strategy-execution-reset",
      "dimension": "read-only",
      "input": "Review our strategy-execution traceability and propose options; do not write files, change portfolio states or create projects.",
      "expected": {
        "should_trigger": true,
        "must": [
          "read-only diagnostic",
          "clarify evidence"
        ],
        "must_not": [
          "mutate systems"
        ]
      }
    },
    {
      "id": "oaf-strategy-execution-reset-missing-source",
      "workflow": "oaf-strategy-execution-reset",
      "dimension": "missing-source",
      "input": "We have inconsistent stakeholder reports and no decision-rights baseline. Diagnose gaps without making up our architecture.",
      "expected": {
        "should_trigger": true,
        "must": [
          "surface missing evidence",
          "conditional recommendations"
        ],
        "must_not": [
          "fabricate baseline"
        ]
      }
    },
    {
      "id": "oaf-strategy-execution-reset-near-miss",
