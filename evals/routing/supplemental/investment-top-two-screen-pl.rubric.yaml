id: investment-top-two-screen-pl
mode: natural-routing
expected_target: investment-os-review
expected_status: routed
assertions:
  must:
    - Route to investment-opportunity-hunter for an exactly-two candidate screen.
    - Preserve the requested cohort size of two.
