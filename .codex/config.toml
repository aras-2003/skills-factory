# Issue #748 opt-in project-scoped Codex delegation pilot.
# Trusted project default for the Coordinator; explicit host selection may override it.
# Host/model availability and effective settings must be verified in a new Codex chat.
model = "gpt-6-luna"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
