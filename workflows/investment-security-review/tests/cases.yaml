cases:
  - id: investment-review-canonical-context-default
    case: Missing canonical context must block unless the user selects the supplied-context route
    input: "Review AMD. Assume the current runtime does not expose investment-record-store. No prior thesis, portfolio or policy context is attached and I have not requested supplied-context mode."
    expected:
      should_trigger: true
      must: ["CANONICAL", "BLOCKED_CANONICAL_READ", "not an empty history", "no numeric sizing"]
      must_not: ["USER_SUPPLIED_CONTEXT selected automatically", "assumed empty portfolio", "canonical write"]

  - id: investment-review-explicit-user-supplied-context
    case: Explicit supplied context permits bounded analysis without a canonical-store claim
    input: "Use USER_SUPPLIED_CONTEXT only. Review AMD as of 2026-11-06 over a 3-year horizon. My baseline thesis is that AI accelerator growth can support higher earnings; challenge that exact thesis. I have no portfolio holdings or policy text to supply, so do not assess portfolio fit or size. Use public filings for factual verification and do not read or write a canonical store."
    expected:
      should_trigger: true
      must: ["USER_SUPPLIED_CONTEXT", "user-supplied thesis", "independently verified facts", "portfolio fit and sizing not assessed", "NOT_WRITTEN"]
      must_not: ["canonical READ receipt", "complete account history", "numeric sizing", "empty portfolio assumption"]

  - id: investment-review-financial-quality-before-valuation
    case: Run multi-period financial quality before valuation
    input: "Review this named security over three to five fiscal years and comparable YTD, then value it only after source, period, unit and basis gates pass."
    expected:
      should_trigger: true
      must: ["Financial Quality Audit", "3–5 fiscal years", "comparable", "block numeric valuation"]
      must_not: ["canonical write without approval", "fill missing facts with zero"]

  - id: investment-review-comparable-peer-screen
    case: Peer table and valuation card use compatible evidence
    input: "For this single issuer, compare same-industry, same-business-model peers with matching definitions and forecast horizons before the scenario card."
    expected:
      should_trigger: true
      must: ["business model", "forecast horizon", "N/M", "valuation card"]
      must_not: ["cross-sector rank", "PEG buy signal"]

  - id: investment-review-ranked-thesis-challenges
    case: Independent sourced countercase after underwriting
    input: "Challenge the established thesis with the strongest materially plausible, ranked downside mechanisms and say what would disconfirm each."
    expected:
      should_trigger: true
      must: ["up to three", "dated sources", "causal", "disconfirm"]
      must_not: ["fabricated bear claim", "automatic sell"]

  - id: investment-review-broad-screen-stays-outside-single-security
    case: Broad candidate screening stays on the opportunity path
    input: "Screen the top twenty broker-available stocks for research candidates; I do not have a named security yet."
    expected:
      should_trigger: false
      must: ["market-opportunity-scan"]
      must_not: ["single-security underwriting"]
