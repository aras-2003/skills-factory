cases:
- id: oaf-governance-redesign-gap-001
  case: Stop before enterprise rollout until the proposed governance mechanism has been tested with a bounded pilot
    and evidence gates.
  input: We reviewed 8 cross-functional funding decisions from the last quarter. The decision log identifies an
    accountable owner for each; 5 decisions were sent through two overlapping committees, and 3 were escalated despite
    being within the documented threshold. The proposed design assigns one decision owner, removes one duplicate
    forum, and uses an asynchronous rule for routine decisions. No pilot has tested its latency, rework, or control
    effects yet. The executive sponsor asks to roll it out company-wide next month. What is the next step?
  expected:
    should_trigger: true
    must:
    - acknowledges the evidence supports a bounded pilot of the proposed decision path
    - does not authorize enterprise rollout before a bounded pilot
    - defines pilot scope and measures for lead time, rework, escalation, and control exceptions
    - sets continue, adjust, or stop criteria before the pilot
    must_not:
    - treats a sponsor date, meeting cadence, or design approval as rollout readiness
    - expands the pilot into an enterprise-wide rollout
- id: oaf-governance-redesign-nearmiss-001
  case: Handle this as a single decision-rights clarification, not governance redesign.
  input: For one proposed data-retention exception, clarify who proposes, advises, decides, and executes under the
    existing policy. There is no recurring decision bottleneck or request to create or change governance mechanisms.
  expected:
    should_trigger: false
    must:
    - Handle this as a single decision-rights clarification, not governance redesign.
    must_not:
    - Do not trigger oaf-governance-redesign for this adjacent request.
    tags:
    - route-to-decision-rights-review
