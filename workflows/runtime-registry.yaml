      lab: supported
      chatgpt-zip: unavailable
    dependencies:
      required:
        - trend-theme-research
        - market-opportunity-scan
        - investment-record-store
      optional:
        - name: report-composer
          on_missing: "If the report has no required visual-floor slot, return a concise integrated text/table report. If material chartable data require a visual, use BLOCKED_NO_RENDERER when no qualifying renderer exists. Do not invent client-display or PASS status."
        - name: visual-output-design
          on_missing: "If visual output is optional, keep the analysis with concise text/table fallback. For a required visual-floor slot, use BLOCKED_NO_RENDERER when no qualifying renderer exists. If a payload is produced, report PAYLOAD_RENDERED and client display NOT_OBSERVABLE."
        - name: investor-pattern-research
          on_missing: "Do not add investor-archetype context."
        - name: security-underwriting
          on_missing: "Return theme candidates only; do not claim company underwriting."
        - name: thesis-challenge
          on_missing: "Keep theme candidates pre-conviction."
    description: >
      Child workflow for Investment OS theme research. Use when selected by investment-os-review, explicitly requested,
      or when thematic/value-chain research is already the clear decision object. Do not use as the default entry point
      for broad natural investment requests.
    metadata:
      owner: arkadiusz-kamrowski
      version: "0.2.0"
      maturity: production
      risk: medium
      last_reviewed: 2026-10-02
      execution:
        default_model_class: standard
