cases:
- id: oaf-operating-model-redesign-gap-001
  case: Stop before design when evidence cannot distinguish structural failure from poor execution; do not invent
    options as if validated.
  input: The user requests a final target operating model from symptoms and provides no representative decision,
    interface, or outcome evidence. State what can be framed, which evidence is needed, and stop before selecting
    a target model.
  expected:
    should_trigger: true
    must:
    - Evidence required to tell structural failure from execution problems
    - preserve provisional status
    - identify the next bounded evidence step.
    must_not:
    - No final target selection, invented owners, org chart, or claim that evidence supports a direction.
- id: oaf-operating-model-redesign-nearmiss-001
  case: Answer the single-decision-rights question without invoking operating-model redesign.
  input: Our platform and regional teams disagree about who approves one customer-data retention exception. The
    decision and evidence are known; map proposer, adviser, approver, and executor. Do not redesign the operating
    model.
  expected:
    should_trigger: false
    must:
    - Answer the single-decision-rights question without invoking operating-model redesign.
    must_not:
    - Do not trigger oaf-operating-model-redesign for this adjacent request.
    tags:
    - route-to-decision-rights-review
