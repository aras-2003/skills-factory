cases:
  - id: router-positive-portfolio
    case: Natural-language portfolio front door
    input: "Review my current portfolio weights and tell me what needs attention."
    expected:
      should_trigger: true
      must:
        - choose investment-portfolio-review as primary child
        - require actual child execution evidence instead of just route selection
  - id: router-positive-theme
    case: Unnamed second-order theme research
    input: "Which second-order AI power infrastructure themes are worth researching, not a buy list?"
    expected:
      should_trigger: true
      must:
        - choose investment-theme-discovery as primary child
        - distinguish routing receipt from child workflow execution
  - id: router-positive-technical-structure
    case: Supplied price swings route to technical structure, not theme research
    input: "For ticker TEST-TECH, I want to analyze adjusted daily OHLCV swings, identify confirmed Dow-style highs/lows (OPS/OPD), trend state and invalidation. I can provide the bar data; do not research a market theme or make an investment recommendation."
    expected:
      should_trigger: true
      must:
        - choose technical-structure as primary child
        - require supplied adjustment metadata, currency, timestamps and source IDs
        - distinguish a price-structure request from market-theme research
        - distinguish routing receipt from child workflow execution
      must_not:
        - choose investment-theme-discovery for the supplied price-structure task
        - invent OHLCV inputs or claim to execute the bundled Python engine
  - id: router-positive-weekly-undervaluation-screen
    case: Weekly undervaluation screening without a named security
    input: "Prepare this week's undervaluation screen. Include 3-, 6-, and 12-month outcomes. No named security."
    expected:
      should_trigger: true
      must:
        - choose investment-opportunity-hunter as primary child
        - keep screening distinct from valuation review of a named security
        - distinguish routing receipt from child workflow execution
  - id: router-positive-methodology-audit-incidental-ticker-en
    case: Investment OS methodology audit with incidental ticker
    input: "Audit the Investment OS workflow and methodology for MU; identify process gaps, not a company thesis."
    expected:
      should_trigger: true
      must:
        - preserve process audit as the decision object
        - route to the Investment OS front door
        - avoid single-security underwriting and unnecessary portfolio reads/writes
      must_not:
        - route to investment-security-review solely because MU appears
  - id: router-positive-methodology-audit-incidental-ticker-pl
    case: Audyt metodologii Investment OS z przypadkowym tickerem
    input: "Przejrzyj metodologię i przepływ pracy Investment OS dla tickera AMD; chodzi o audyt procesu, nie analizę spółki."
    expected:
      should_trigger: true
      must:
        - preserve process audit as the decision object
        - avoid single-security underwriting and unnecessary account reads/writes
      must_not:
        - treat AMD as the security being evaluated
  - id: router-positive-process-audit-polish-synonym
    case: Polish audyt wording with incidental ticker
    input: "Zrób audyt procesu Investment OS na przykładzie tickera MU. Sprawdzam routing i workflow, nie tezę spółki."
    expected:
      should_trigger: true
      must:
        - route to the Investment OS front door
        - keep the process as the decision object
        - avoid security underwriting and portfolio reads/writes
  - id: router-positive-security-review-neighbor
    case: Direct named-security decision remains a security review
    input: "Review MU's thesis, valuation and downside as a single security."
    expected:
      should_trigger: true
      must:
        - choose investment-security-review as primary child
        - distinguish routing from child execution
  - id: router-negative-generic-education
    case: General term definition outside personal investment workflow
    input: "Explain in two sentences what the price-to-earnings ratio means, without discussing any security or my holdings."
    expected:
      should_trigger: false
      must:
        - answer the narrow educational question without canonical portfolio workflow
      must_not:
        - read investment accounts without need
  - id: router-negative-loan-calculation
    case: Personal mortgage financing is not investment portfolio review
    input: "I need a simple explanation of fixed versus variable rates on a home mortgage, not investment advice."
    expected:
      should_trigger: false
      must:
        - keep the scope on home financing
      must_not:
        - invoke Investment OS portfolio research
  - id: router-positive-systemic-risk-triage
    case: Cross-asset systemic signals route to attention triage
    input: "Systemic risk indicators across credit markets and macro conditions have changed. Assess these indicator groups, distinguish published historical vintages, deduplicate correlated evidence, and state materiality and direction separately. No portfolio-specific assessment, no holdings, no trades, no policy change, and no writes."
    expected:
      should_trigger: true
      must:
        - choose investment-attention-review before portfolio-specific analysis
        - distinguish routing receipt from child workflow execution
        - preserve no-write and no-trade constraints
  - id: router-positive-systemic-risk-without-portfolio
    case: Cross-asset indicators route without portfolio vocabulary
    input: "Triage these systemic market risk indicators: HY and IG spreads are correlated, breadth data is stale, and real yield is missing. Preserve vintages and say whether the evidence is material; do not estimate crash odds."
    expected:
      should_trigger: true
      must:
        - choose investment-attention-review
        - preserve stale and missing data explicitly
  - id: router-negative-generic-credit-definition
    case: Generic credit spread definition is not Investment OS triage
    input: "Explain what a credit spread means in one sentence."
    expected:
      should_trigger: false
      must:
        - answer as a general educational question without an investment workflow
  - id: router-positive-portfolio-review-control
    case: Explicit portfolio review keeps portfolio ownership
    input: "Review my portfolio concentration and ETF overlap."
    expected:
      should_trigger: true
      must:
        - choose investment-portfolio-review as primary child
