cases:
  - id: global-local-model-review-001
    case: positive
    input: |
      Apply global-local-model-review to an enterprise IT organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - follow the skill output contract
  - id: global-local-model-review-002
    case: boundary
    input: |
      Give me a generic management best-practice answer without the specific problem this skill addresses.
    expected:
      should_trigger: false
      must_not:
        - run the full global-local-model-review procedure
  - id: global-local-model-review-003
    case: missing-evidence
    input: |
      Use global-local-model-review, but several owners, thresholds or decision facts are unknown.
    expected:
      should_trigger: true
      must:
        - preserve unknowns
        - avoid inventing missing organisational facts

  - id: audit-near-miss-global-local-model-review
    case: second-competing-skill-negative
    input: "We need to discover why handoffs between Product, Sales and IT have unclear owners, before debating global standards or local autonomy."
    expected:
      should_trigger: false
      must:
        - organizational-interface-review diagnoses unclear cross-unit handoffs
      must_not:
        - assume a global/local design issue without evidence
