cases:
  - id: organizational-interface-review-001
    case: positive
    input: |
      Apply organizational-interface-review to an enterprise IT organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - follow the skill output contract
  - id: organizational-interface-review-002
    case: boundary
    input: |
      Give me a generic management best-practice answer without the specific problem this skill addresses.
    expected:
      should_trigger: false
      must_not:
        - run the full organizational-interface-review procedure
  - id: organizational-interface-review-003
    case: missing-evidence
    input: |
      Use organizational-interface-review, but several owners, thresholds or decision facts are unknown.
    expected:
      should_trigger: true
      must:
        - preserve unknowns
        - avoid inventing missing organisational facts

  - id: audit-near-miss-organizational-interface-review
    case: second-competing-skill-negative
    input: "A specific customer-contract exception has a known owner but waits several days for approvals, vetoes and rework. Trace the actual decision path."
    expected:
      should_trigger: false
      must:
        - decision-bottleneck-analysis diagnoses one identified slow decision path
      must_not:
        - reframe an identified approval path as generic cross-unit interface ambiguity
