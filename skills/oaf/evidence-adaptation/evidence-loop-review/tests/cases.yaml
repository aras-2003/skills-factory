cases:
  - id: evidence-loop-review-001
    case: positive
    input: |
      Apply evidence-loop-review to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: evidence-loop-review-002
    case: near-miss
    input: |
      Give me a generic explanation unrelated to this skill.
    expected:
      should_trigger: false
      must_not:
        - perform the full evidence-loop-review workflow
  - id: evidence-loop-review-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use evidence-loop-review without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns

  - id: audit-near-miss-evidence-loop-review
    case: second-competing-skill-negative
    input: "Review whether the uptime metric definition has a numerator, denominator and reliable data owner. I am not asking why governance meetings ignore dashboards."
    expected:
      should_trigger: false
      must:
        - kpi-quality-review validates one decision-useful KPI
      must_not:
        - expand one metric-definition check into an enterprise evidence-feedback diagnosis
