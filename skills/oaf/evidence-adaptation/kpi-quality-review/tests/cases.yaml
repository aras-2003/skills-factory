cases:
  - id: kpi-quality-review-001
    case: positive
    input: |
      Apply kpi-quality-review to an enterprise IT organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - follow the skill output contract
  - id: kpi-quality-review-002
    case: boundary
    input: |
      Give me a generic management best-practice answer without the specific problem this skill addresses.
    expected:
      should_trigger: false
      must_not:
        - run the full kpi-quality-review procedure
  - id: kpi-quality-review-003
    case: missing-evidence
    input: |
      Use kpi-quality-review, but several owners, thresholds or decision facts are unknown.
    expected:
      should_trigger: true
      must:
        - preserve unknowns
        - avoid inventing missing organisational facts

  - id: audit-near-miss-kpi-quality-review
    case: second-competing-skill-negative
    input: "All 40 KPI definitions are sound; the problem is that executives never change funding or decisions after monthly reviews."
    expected:
      should_trigger: false
      must:
        - evidence-loop-review diagnoses why validated information does not drive action
      must_not:
        - redefine each KPI despite the user's request for governance diagnosis
