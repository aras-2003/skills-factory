cases:
  - id: architecture-review-001
    case: positive
    input: |
      Apply architecture-review to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: architecture-review-002
    case: near-miss
    input: |
      Review this React component architecture.
    expected:
      should_trigger: false
      must_not:
        - perform the full architecture-review workflow
  - id: architecture-review-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use architecture-review without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns

  - id: audit-near-miss-architecture-review
    case: second-competing-skill-negative
    input: "Two engineers need to choose a Kafka topic partitioning strategy, schema evolution and retry pattern for one microservice."
    expected:
      should_trigger: false
      must:
        - software architecture decision is too low-level for enterprise architecture skill
      must_not:
        - reframe one service implementation as enterprise capability strategy
