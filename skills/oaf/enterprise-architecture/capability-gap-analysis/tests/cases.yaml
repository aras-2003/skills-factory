cases:
  - id: capability-gap-analysis-001
    case: positive
    input: |
      Apply capability-gap-analysis to an enterprise IT organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - follow the skill output contract
  - id: capability-gap-analysis-002
    case: boundary
    input: |
      Give me a generic management best-practice answer without the specific problem this skill addresses.
    expected:
      should_trigger: false
      must_not:
        - run the full capability-gap-analysis procedure
  - id: capability-gap-analysis-003
    case: missing-evidence
    input: |
      Use capability-gap-analysis, but several owners, thresholds or decision facts are unknown.
    expected:
      should_trigger: true
      must:
        - preserve unknowns
        - avoid inventing missing organisational facts

  - id: audit-near-miss-capability-gap-analysis
    case: second-competing-skill-negative
    input: "We already have a finished capability map. Check whether two L1 capabilities overlap in scope and have inconsistent naming."
    expected:
      should_trigger: false
      must:
        - capability-map-review checks map coherence before a gap analysis
      must_not:
        - infer missing capabilities or projects from naming alone
