cases:
  - id: governance-design-001
    case: positive
    input: |
      Apply governance-design to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: governance-design-002
    case: near-miss
    input: |
      Create a generic weekly status meeting agenda.
    expected:
      should_trigger: false
      must_not:
        - perform the full governance-design workflow
  - id: governance-design-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use governance-design without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns

  - id: audit-near-miss-governance-design
    case: second-competing-skill-negative
    input: "The material problem is that we still cannot identify who decides a product launch date. Map proposers, deciders and escalation rights before building committees."
    expected:
      should_trigger: false
      must:
        - decision-rights-review diagnoses authority for a known decision
      must_not:
        - design broad governance mechanisms before identifying actual decision rights
