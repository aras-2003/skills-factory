cases:
  - id: portfolio-health-review-001
    case: positive
    input: |
      Apply portfolio-health-review to an enterprise IT organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - follow the skill output contract
  - id: portfolio-health-review-002
    case: boundary
    input: |
      Give me a generic management best-practice answer without the specific problem this skill addresses.
    expected:
      should_trigger: false
      must_not:
        - run the full portfolio-health-review procedure
  - id: portfolio-health-review-003
    case: missing-evidence
    input: |
      Use portfolio-health-review, but several owners, thresholds or decision facts are unknown.
    expected:
      should_trigger: true
      must:
        - preserve unknowns
        - avoid inventing missing organisational facts

  - id: audit-near-miss-portfolio-health-review
    case: second-competing-skill-negative
    input: "Five initiatives have comparable benefits and resource requirements. We know portfolio capacity and now need to rank which ones receive funding."
    expected:
      should_trigger: false
      must:
        - portfolio-prioritization chooses initiatives after health and evidence are ready
      must_not:
        - restart portfolio health diagnostics instead of making the requested ranking
