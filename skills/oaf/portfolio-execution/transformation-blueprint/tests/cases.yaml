cases:
  - id: transformation-blueprint-001
    case: positive
    input: |
      Apply transformation-blueprint to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: transformation-blueprint-002
    case: near-miss
    input: |
      Give me a generic explanation unrelated to this skill.
    expected:
      should_trigger: false
      must_not:
        - perform the full transformation-blueprint workflow
  - id: transformation-blueprint-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use transformation-blueprint without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns

  - id: audit-near-miss-transformation-blueprint
    case: second-competing-skill-negative
    input: "We only need to determine whether current decision forums have clear rights for a single product-launch decision. Do not build a transformation roadmap."
    expected:
      should_trigger: false
      must:
        - decision-rights-review identifies decision owners before transformation design
      must_not:
        - construct a full change program for a narrow decision-rights question
