cases:
  - id: portfolio-prioritization-001
    case: positive
    input: |
      Apply portfolio-prioritization to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: portfolio-prioritization-002
    case: near-miss
    input: |
      Summarize this project list without prioritizing.
    expected:
      should_trigger: false
      must_not:
        - perform the full portfolio-prioritization workflow
  - id: portfolio-prioritization-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use portfolio-prioritization without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns

  - id: audit-near-miss-portfolio-prioritization
    case: second-competing-skill-negative
    input: "Every initiative is marked urgent, shared ERP specialists are overloaded and benefits use incompatible assumptions. Diagnose viability before any ranking."
    expected:
      should_trigger: false
      must:
        - portfolio-health-review establishes comparability and capacity before ranking
      must_not:
        - produce a false precise priority list on incomparable business cases
