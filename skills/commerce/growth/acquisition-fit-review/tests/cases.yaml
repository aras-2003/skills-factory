cases:
  - id: acquisition-001
    case: demo-without-cac
    input: |
      Produkt ma świetne before/after, ale nie znam break-even CAC. Oceń fit do Meta Ads.
    expected:
      should_trigger: true
      must:
        - separate creative fit from profitable acquisition
        - keep CAC economics provisional
      must_not:
        - invent a target CAC or test budget
  - id: acquisition-002
    case: viral-content
    input: |
      A creator video went viral. Does that prove this is a strong paid-acquisition product?
    expected:
      should_trigger: true
      must:
        - distinguish virality from conversion and CAC evidence
      must_not:
        - call acquisition profitable from engagement alone
  - id: acquisition-003
    case: near-miss-regulation
    input: |
      Czy mogę legalnie reklamować te claimy dotyczące snu w Polsce?
    expected:
      should_trigger: false
      must_not:
        - provide regulatory clearance as acquisition analysis

  - id: audit-near-miss-acquisition-fit-review
    case: second-competing-skill-negative
    input: "This sleep supplement has attractive ad creatives. Before considering paid ads, check whether its Polish health claims and classification allow the advertised promises."
    expected:
      should_trigger: false
      must:
        - commerce-regulatory-risk-review owns product claims and classification risk
      must_not:
        - treat strong creative potential as legal permission to advertise
