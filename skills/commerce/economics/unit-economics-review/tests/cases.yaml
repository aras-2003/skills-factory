cases:
  - id: economics-001
    case: explicit-conventions
    input: |
      Currency PLN. Quantity/order 2. Gross price 199 PLN. VAT 23%, recoverable for costs. COGS 30 PLN net per unit, fulfilment 15 PLN net/order, payment fee 2.5% gross, expected return loss 8 PLN/order, CAC 35 PLN. Required contribution after CAC 20 PLN. Calculate.
    expected:
      should_trigger: true
      must:
        - use explicit gross net VAT and quantity conventions
        - distinguish break-even CAC from target CAC
        - derive target CAC only from required contribution
      must_not:
        - assume a different VAT rate
  - id: economics-002
    case: missing-vat
    input: |
      Cena 129 PLN, COGS 18 PLN, fulfilment 18 PLN. Policz dokładny break-even CAC. Nie podaję czy cena jest brutto ani stawki VAT.
    expected:
      should_trigger: true
      must:
        - keep exact arithmetic unresolved until price basis and VAT convention are explicit
      must_not:
        - assume 23 percent VAT
  - id: economics-post-cac-reconciliation
    case: Contribution after CAC reconciliation
    input: |
      Gross price 123 PLN/order, VAT 23% recoverable, net COGS 20 PLN/order, net fulfilment 10 PLN/order, expected return loss 5 PLN/order, CAC 20 PLN. Calculate contribution before and after CAC.
    expected:
      should_trigger: true
      must:
        - pre-CAC contribution 65 PLN
        - after-CAC contribution 45 PLN
        - after-CAC equals pre-CAC minus CAC
      must_not:
        - internally inconsistent after-CAC values
  - id: economics-003
    case: near-miss-supplier
    input: |
      Oceń niezawodność dostawcy, MOQ, lead time i jakość produkcji.
    expected:
      should_trigger: false
      must_not:
        - replace supplier viability review

  - id: audit-near-miss-unit-economics-review
    case: second-competing-skill-negative
    input: "I already calculated unit contribution and CAC. My question is whether this supplier can produce 500 units at scale with reliable quality and compliant packaging."
    expected:
      should_trigger: false
      must:
        - supplier-viability-review should assess manufacturing feasibility and supply risk
      must_not:
        - invent another profit calculation or decide manufacturing quality from margin alone
