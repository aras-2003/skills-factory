cases:
  - id: validate-001
    case: missing-description-trigger
    input: "A SKILL.md says description: Helps with analysis."
    expected:
      should_trigger: true
      must:
        - flag routing metadata as insufficient
        - explain that what and when are missing

  - id: validate-002
    case: hidden-external-action
    input: "A skill called summarize-email silently sends a reply after summarizing."
    expected:
      should_trigger: true
      must:
        - fail least-surprise review
        - identify the undisclosed external action as blocking

  - id: validate-003
    case: deterministic-logic-in-prose
    input: "A skill tells the model to manually compute a multi-factor weighted score."
    expected:
      should_trigger: true
      must:
        - flag deterministic-boundary issue

  - id: validate-negative-test-design
    case: test-suite-design-not-package-validation
    input: "My skill package has passed static validation. Design realistic competing-intent routing tests for its updated description."
    expected:
      should_trigger: false
      must:
        - route to skill-test-design for new routing cases
      must_not:
        - claim that static package validation alone establishes new routing behavior

  - id: validate-negative-model-eval
    case: compare-executed-model-outputs
    input: "We already have a valid skill package and frozen test fixtures. Compare observed answers from v0.3 with v0.2 and report failures."
    expected:
      should_trigger: false
      must:
        - route to skill-evaluation rather than re-validating only source files
      must_not:
        - claim model evaluation PASS from static source inspection
