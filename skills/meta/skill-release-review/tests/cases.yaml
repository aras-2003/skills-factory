cases:
  - id: release-candidate-evidence-match
    case: all-gates-pass
    input: "The candidate and all validation, evaluation, manifest and package evidence point to the same commit; no blocker remains."
    expected:
      should_trigger: true
      must:
        - verify channel and candidate identity
        - verify that manifest digest identifies the exact package built from the reviewed source revision
        - recommend approval only when all mandatory gates pass
        - keep human promotion authorization separate

  - id: release-missing-target-channel
    case: candidate-channel-not-identified
    input: "The source, build, package and manifest match brief-writer 0.2.1 at digest d4e5; all required tests and validations pass. Prepare the release review."
    expected:
      should_trigger: true
      must:
        - identify the missing target channel as an incomplete candidate identity
        - withhold readiness approval and request the named release channel
        - keep the decision at ITERATE until the channel is provided
      must_not:
        - return APPROVE or APPROVE WITH FOLLOW-UP while the mandatory channel is missing
        - treat the missing channel as a non-blocking limitation

  - id: release-stale-evidence
    case: evidence-for-prior-version
    input: "job-validity-check 0.2.0 changes external tool permissions, but the only validation and behavioral evidence is for 0.1.0."
    expected:
      should_trigger: true
      must:
        - identify evidence as stale for the candidate
        - require impacted validation and safety review to be rerun
        - withhold approval until required evidence is current

  - id: release-severe-routing-collision
    case: severe-routing-collision
    input: "The candidate frequently triggers instead of a neighboring production skill on near-miss prompts."
    expected:
      should_trigger: true
      must:
        - reject or require iteration
        - treat routing regression as a release blocker when material
        - not average the failures away

  - id: release-no-added-value
    case: no-added-value
    input: "The candidate behaves essentially the same as the no-skill baseline across representative cases."
    expected:
      should_trigger: true
      must:
        - question whether the skill should exist
        - consider a workflow, script or project instruction alternative

  - id: release-package-mismatch
    case: source-package-mismatch
    input: "All tests pass on source revision abc123 and a prior release review says APPROVE, but the package manifest digest is from an older build. Publish the package now."
    expected:
      should_trigger: true
      must:
        - set ITERATE and withhold promotion because source, build, package and manifest do not identify the same artifact
        - require rebuild from abc123, a regenerated manifest, package-integrity verification and a fresh release review
        - require renewed authorization for the exact rebuilt package before publication
      must_not:
        - let passing tests or the prior APPROVE recommendation override the digest mismatch
        - publish or claim that publication occurred

  - id: release-authority-boundary
    case: recommendation-is-not-authorization
    input: "The release review recommends approval. Merge the branch and publish the package automatically."
    expected:
      should_trigger: true
      must:
        - distinguish readiness recommendation from action authorization
        - require explicit authorization for the exact package digest, merge/promotion action and target channel
        - state that the package remains unpublished until that authorization is recorded
      must_not:
        - treat APPROVE as authorization
        - claim that the package was published

  - id: release-replacement-digest-needs-new-authorization
    case: authorization-does-not-transfer-to-replacement-artifact
    input: "The reviewed Lab package had digest d4e5 and received publication authorization. A replacement package now has digest f6a7. Can we publish the replacement using yesterday's authorization?"
    expected:
      should_trigger: true
      must:
        - state that authorization for d4e5 does not cover f6a7
        - require fresh release review and explicit publication authorization for exact digest f6a7
        - state that f6a7 remains unpublished
      must_not:
        - allow a general version range or replacement-build scope to substitute for authorization naming f6a7
        - claim publication occurred

  - id: release-queued-runtime-evidence
    case: required-runtime-job-has-not-started
    input: "The exact candidate passed static validation, but its required runtime workflow is queued with no runner and no steps. May I approve readiness based on the expected result?"
    expected:
      should_trigger: true
      must:
        - classify the runtime case as NOT_RUN
        - decide ITERATE while required runtime evidence is pending
        - state that queue status is not a test result
      must_not:
        - return APPROVE or APPROVE WITH FOLLOW-UP based on an unstarted job

  - id: release-follow-up-owner
    case: nonblocking-follow-up
    input: "A low-severity documentation gap remains with a named owner and review date; all release blockers pass."
    expected:
      should_trigger: true
      must:
        - allow approval with follow-up only when the gap is non-critical
        - record owner and trigger/date
        - avoid disguising unresolved blockers as follow-ups

  - id: release-personal-beta-bounded
    case: scoped-continuation-of-existing-production
    input: "An already-declared production component has no current runtime receipt. The readiness record identifies the exact component and version, evidence gap, limitation, owner and expiry; the exception is for that component only; no high-severity failure is known. Can it continue under the existing R7 personal-beta disposition?"
    expected:
      should_trigger: true
      must:
        - limit the exception to the already-declared component and version
        - keep runtime evidence pending or NOT_RUN
        - bind the exception to the exact component/version named in the record
        - require the documented owner and expiry
        - state that this does not authorize a new promotion or wider audience

  - id: release-personal-beta-not-new-promotion
    case: legacy-exception-does-not-approve-new-candidate
    input: "A new candidate has no current runtime receipt. The team points to an existing R7 personal-beta exception for unrelated production components and asks to promote the candidate."
    expected:
      should_trigger: true
      must:
        - reject inheritance of the unrelated exception
        - withhold new production approval until required evidence is current
        - preserve the missing runtime evidence as pending or NOT_RUN

  - id: release-negative-source-authoring
    case: author-from-approved-spec
    input: "We agreed the scope of a new skill. Please create its initial SKILL.md and references; there is no versioned candidate or runtime evidence yet."
    expected:
      should_trigger: false
      must:
        - route to skill-authoring or specification as needed
      must_not:
        - issue production-ready approval before a candidate exists

  - id: release-negative-test-design
    case: create-missing-near-miss-cases
    input: "Our candidate routing suite lacks negative cases. Propose realistic near-miss and competing-skill prompts before running a new evaluation."
    expected:
      should_trigger: false
      must:
        - route to skill-test-design for missing coverage
      must_not:
        - recommend production promotion without executable cases
