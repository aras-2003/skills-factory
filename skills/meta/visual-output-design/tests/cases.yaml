cases:
  - id: visual-output-chart
    case: Quantitative comparison benefits from a chart
    input: |
      Compare the six candidate stocks over 3, 6 and 12 months and present it visually.
    expected:
      should_trigger: true
      must:
        - choose an appropriate chart or interactive report
        - preserve dates, units and provenance
        - avoid inventing missing price data

  - id: visual-output-org-model
    case: Operating model should use a real diagram
    input: |
      Show the target operating model and decision interfaces as a professional editable diagram.
    expected:
      should_trigger: true
      must:
        - choose a diagram or Figma-style editable visual
        - avoid unsupported reporting-line assumptions
        - provide a text fallback

  - id: visual-output-html
    case: Multi-view dashboard warrants interactive HTML
    input: |
      Turn this portfolio review into a compact interactive cockpit with allocation, concentration, scenarios and sources.
    expected:
      should_trigger: true
      must:
        - separate visual payload from presentation logic
        - keep canonical data and provenance intact
        - use interactive HTML only if runtime support exists

  - id: visual-output-no-decoration
    case: Simple answer should remain text
    input: |
      What is free cash flow yield?
    expected:
      should_trigger: false
      must_not:
        - create a dashboard
        - create a decorative chart

  - id: visual-output-no-fabrication
    case: Missing data should block invented visual values
    input: |
      Draw a detailed org chart, but I only know the names of three departments and no reporting lines.
    expected:
      should_trigger: true
      must:
        - preserve unknown relationships
        - avoid inventing hierarchy


  - id: visual-output-capability-preflight
    case: Required quantitative visual has no deterministic renderer
    input: |
      The report contains chartable portfolio allocation data, but this runtime exposes only image generation,
      image viewing and Figma diagram/design capabilities.
    expected:
      should_trigger: true
      must:
        - run capability preflight
        - classify the quantitative chart renderer as unavailable
        - return BLOCKED_NO_RENDERER
        - keep any table fallback explicitly diagnostic
      must_not:
        - use image generation for factual quantitative charting
        - count Figma diagram/design as a native quantitative chart renderer
        - report successful rendering


  - id: visual-output-payload-client-not-observable
    case: PNG payload exists but client rendering is outside model observability
    input: |
      The renderer returned CHART_PAYLOAD_OK and a PNG ImageContent block.
    expected:
      should_trigger: true
      must:
        - classify renderer execution as PAYLOAD_RENDERED
        - classify client display as NOT_OBSERVABLE
      must_not:
        - UI_CONFIRMED
        - UI_RENDER_UNCONFIRMED
        - claim successful inline rendering

  - id: visual-output-static-is-not-interactive
    case: Static chart is rendered but no dynamic controls exist
    input: |
      The only callable chart renderer returns a PNG. Make a more dynamic comparison dashboard for three stocks.
    expected:
      should_trigger: true
      must:
        - classify the actual visual as STATIC
        - render the PNG inline and label it static when data are supported
        - state that selector/filter controls are unavailable
      must_not:
        - describe the PNG as interactive or controlled
        - invent a chart-widget call or fake dropdown

  - id: visual-output-controlled-needs-real-control
    case: Distinguish a real selector from hover behavior
    input: |
      The runtime returns a native chart with hover tooltips but exposes no ticker or metric selector. The user asked to switch stocks.
    expected:
      should_trigger: true
      must:
        - classify interaction as HOVER, not CONTROLLED
        - state that requested ticker switching is unavailable or blocked
        - preserve a useful chart if supported
      must_not:
        - claim that hover verifies ticker selection
        - describe the chart as a controlled dashboard

  - id: visual-output-normalized-shortlist
    case: Static comparison of comparable multi-candidate prices
    input: |
      Compare verified monthly prices for three candidates over the same dates and put their distinct thesis KPIs in the same dashboard.
    expected:
      should_trigger: true
      must:
        - index comparable price series to 100 at the common first date
        - keep company-specific KPI units in separate charts
        - label period, price basis, provenance and as-of date
        - label static output when the renderer has no controls
      must_not:
        - imply price-only lines are total return
        - plot unrelated KPIs on one shared axis
        - interpolate missing observations

  - id: audit-near-miss-visual-output-design
    case: second-competing-skill-negative
    input: "Turn my findings into a structured executive report with sections, logical flow, decisions and evidence. I am not asking to render charts or diagrams."
    expected:
      should_trigger: false
      must:
        - report-composer should own the narrative structure and reading flow
      must_not:
        - produce decorative visuals or falsely claim embedded graphics
