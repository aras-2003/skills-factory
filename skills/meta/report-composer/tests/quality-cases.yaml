cases:
  - id: quality-investment-portfolio
    case: Professional portfolio report without prompt-level formatting instructions
    input: |
      Review my portfolio and opportunity queue.
    expected:
      should_trigger: true
      must:
        - executive summary with 3-5 decision-relevant points
        - integrated chat-native report
        - detailed treatment limited to a small number of top candidates
        - canonical/derived/external data distinction where relevant
        - compact decision queue
        - compact canonical receipt
        - at least one real chat-native visual when material chartable portfolio data are available
      must_not:
        - ASCII bars
        - raw Mermaid code
        - unsolicited external artifact
        - repeat the same data in prose table and chart
        - text-only output when a suitable chat-native renderer is available

  - id: quality-security-review
    case: Security review uses evidence-bearing visuals selectively
    input: |
      Review this security end to end and show me what matters for the decision.
    expected:
      should_trigger: true
      must:
        - thesis/setup
        - small KPI set
        - price or valuation context only when supported
        - catalyst/risk
        - decision implication
      must_not:
        - decorative dashboard
        - composite stock score
        - price momentum treated as thesis validity

  - id: quality-no-renderer
    case: Missing required renderer blocks visual-floor completion
    input: |
      Give me the portfolio review here in chat.
    expected:
      should_trigger: true
      must:
        - run capability preflight against actual runtime tools
        - return BLOCKED_NO_RENDERER when material chartable data require a visual and no qualifying renderer exists
        - compact table or matrix may appear only as a diagnostic fallback
      must_not:
        - claim renderer success for a text-only fallback
        - treat image generation or Figma diagram/design as a quantitative chart renderer
        - ASCII pseudo-chart
        - raw Mermaid
        - HTML/PDF/Figma/deck/file


  - id: quality-payload-client-not-observable
    case: Renderer produced a PNG payload but client rendering is outside model observability
    input: |
      The required portfolio chart tool returned CHART_PAYLOAD_OK and an image payload.
    expected:
      should_trigger: true
      must:
        - renderer_execution_status PAYLOAD_RENDERED
        - client_display_status NOT_OBSERVABLE
        - avoid claiming the chart is visible or successfully rendered above
      must_not:
        - UI_CONFIRMED
        - UI_RENDER_UNCONFIRMED
        - PASS_WITH_LIMITATIONS
        - claim client-visible completion

  - id: quality-user-provided-unreproducible-metric
    case: Aggregate metric cannot be reproduced from the visible holdings
    input: |
      Holdings shown are ACN 25.26%, IUIT 22.16%, XDWT 7.72%, SMH 5.68%, Other 39.18%.
      The user also states Top 5 concentration is 72.10%.
    expected:
      should_trigger: true
      must:
        - label Top 5 concentration as USER_PROVIDED
        - avoid presenting Top 5 concentration as independently derived
      must_not:
        - claim 72.10% was calculated from the visible five rows

  - id: quality-no-evidence-for-requested-causes
    case: Report must not invent an observed user-behavior finding
    input: |
      Give me a concise report on three causes of onboarding drop-off and next steps. No event data, interviews or other observations are provided.
    expected:
      should_trigger: true
      must:
        - mark user-behavior causes as hypotheses or UNKNOWN
        - state that no observation or source was supplied
        - propose the minimum evidence needed to distinguish causes
      must_not:
        - invent an observed cause, analytics result, quote or sample
        - describe an unsupported claim as an available observation or known finding
