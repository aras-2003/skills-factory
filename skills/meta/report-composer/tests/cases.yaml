cases:
  - id: integrated-investment-report
    case: Security report with inline interactive chart
    input: |
      Prepare one coherent Micron investment review. Put the 3/6/12 month price chart inside the price-context section,
      not in a separate dashboard.
    expected:
      should_trigger: true
      must:
        - one integrated report
        - inline visual slot near price context
        - provenance and as-of context
        - text fallback if inline rendering is unavailable
      must_not:
        - duplicate full visual dashboard beside the text report
        - create HTML/PDF/Figma/deck/file unless explicitly requested

  - id: cloud-next-inline-interactive-report
    case: Interactive chart is an integrated report element in normal Chat
    input: |
      Summarize these verified quarterly results here in Chat. Include an interactive trend chart in the results section and explain the key movement beside it; do not create a separate dashboard or file.
    expected:
      should_trigger: true
      must:
        - report-composer owns one coherent narrative and section placement
        - visual-output-design invokes the exposed Cloud Next chart renderer with the supplied verified values
        - chart is requested in inline display and used as a report element
        - interpretation and chart remain in the same conversation flow
        - report notes host display only when independently observed
      must_not:
        - expose render_bar_chart as a separate user-facing workflow or skill
        - create a parallel dashboard, fullscreen chart or external artifact
        - claim arbitrary insertion inside prose is guaranteed by the host

  - id: integrated-oaf-report
    case: Operating-model report with embedded editable diagram
    input: |
      Present the operating-model redesign as one executive report with the target model diagram embedded where the target
      model is discussed.
    expected:
      should_trigger: true
      must:
        - report sections
        - inline structural visual
        - avoid inventing reporting lines

  - id: explicit-html-report
    case: External HTML report is allowed only when explicitly requested
    input: |
      Build an interactive portfolio report with narrative, charts and opportunity sections in one HTML report.
    expected:
      should_trigger: true
      must:
        - one explicitly requested rich integrated report
        - separate semantic payload from rendering
        - progressive disclosure
      must_not:
        - full duplicate text report plus separate full dashboard

  - id: no-unsolicited-artifact
    case: Chat-native report is default even when HTML could be richer
    input: |
      Review my portfolio and opportunity queue. Give me the report here in the chat, with visuals embedded in the relevant sections.
    expected:
      should_trigger: true
      must:
        - one integrated chat-native report
        - embedded or chat-native visual fallbacks
      must_not:
        - create HTML file
        - create PDF
        - create Figma file
        - create deck
        - replace chat report with an external artifact

  - id: exhibit-adapts-to-requested-output-format
    case: Preserve semantic exhibit while embedding it in the requested final format
    input: |
      Prepare the same results as a DOCX report and a PPTX summary. Reuse the exact sourced chart data and make each chart editable where the target tool supports it.
    expected:
      should_trigger: true
      must:
        - one source-backed ExhibitSpec carries through both output pipelines
        - DOCX and PPTX owners embed the exhibit using target-native/editable forms when verified
        - report and presentation outputs receive separate format-specific QA
        - interaction/editability loss is recorded per output
      must_not:
        - assume a chart editable in one format is editable in another
        - treat a flattened PDF/image as an editable component
        - claim both artifacts pass based on one renderer invocation

  - id: simple-answer-no-report
    case: Narrow concept question
    input: |
      What is free cash flow yield?
    expected:
      should_trigger: false
      must_not:
        - compose a multi-section report
        - create visual slots

  - id: integrated-investment-shortlist-static-fallback
    case: Multi-candidate dashboard with static visual renderer only
    input: |
      Compare three research candidates. Use one shared normalized price chart if verified price histories overlap,
      then place a thesis-driving KPI chart inside each candidate section. This runtime only returns static images.
    expected:
      should_trigger: true
      must:
        - compact shortlist dashboard near the opening
        - normalize comparable shared prices to 100 at the first common date
        - keep each company's KPI chart local to its section and preserve its units
        - label actual images static and identify unavailable controls
        - show exact blocked slots when data are not available
      must_not:
        - claim selector/filter interactions
        - compare unrelated KPIs on a shared axis
        - claim a chart exists when its image is not included

  - id: audit-near-miss-report-composer
    case: second-competing-skill-negative
    input: "A report has already been composed with the correct sections and evidence. I only need a clean SVG bar chart for one quantitative comparison; don't rewrite the narrative."
    expected:
      should_trigger: false
      must:
        - visual-output-design should render the requested local visual
      must_not:
        - recompose or expand the report when only a chart is needed
