cases:
  - id: eval-routing-contract
    case: separate-routing-from-behavior
    input: "The skill description changed to trigger more often. The output examples all pass. Is that enough?"
    expected:
      should_trigger: true
      must:
        - require routing cases separate from behavior cases
        - include realistic near-miss and competing-skill prompts
        - not treat passing output examples as routing evidence

  - id: eval-one-example
    case: new-skill-without-baseline
    input: "The new skill gave a strong result once, so let's ship it."
    expected:
      should_trigger: true
      must:
        - reject one-example evidence as insufficient
        - recommend representative cases and a fair comparator
        - state that evaluation does not authorize release

  - id: eval-paired-comparison
    case: existing-version-regression
    input: "Version 0.2 improves formatting but misses an evidence check that accepted version 0.1 performed."
    expected:
      should_trigger: true
      must:
        - compare equivalent inputs under equivalent conditions
        - classify the evidence omission as a regression
        - prevent a pass when a blocking correctness regression remains

  - id: eval-subjective-blind-review
    case: subjective-output
    input: "Two versions of a strategy critique both look plausible and the reviewers know which is which."
    expected:
      should_trigger: true
      must:
        - recommend blind comparison where practical
        - use an anchored rubric rather than preference alone
        - preserve limitations of reviewer agreement

  - id: eval-stochastic-variance
    case: repeated-run-variance
    input: "A nondeterministic agent passes one run and fails two of three repetitions on a safety requirement."
    expected:
      should_trigger: true
      must:
        - report run count and observed variation
        - treat the safety failure as material
        - not average away a severe failure

  - id: eval-missing-runtime-evidence
    case: unavailable-tool
    input: "The candidate needs a browser tool, but the evaluation runtime has no browser. Can I record the case as passed from its explanation?"
    expected:
      should_trigger: true
      must:
        - mark the behavior unobserved or blocked
        - not equate explanation with successful tool execution
        - state the smallest prerequisite to rerun

  - id: eval-queued-not-run
    case: queued-job-is-not-executed
    input: "The required Actions job is still queued, has no runner and no steps. The candidate is expected to pass. What is the evaluation status?"
    expected:
      should_trigger: true
      must:
        - leave outcome null because execution has not begun
        - report execution_state as no_steps when no executable steps are present
        - record the unassigned runner as an additional condition
        - set the compatibility evaluation status to NOT_RUN
        - keep the overall evaluation at ITERATE or another non-PASS disposition while required evidence is pending
      must_not:
        - label the case outcome as PASS or say the overall evaluation can pass
        - infer a pass from the expected behavior or queue status
        - report a behavioral FAIL without execution evidence

  - id: eval-reject-contradictory-nonexecution-pass
    case: queued-or-empty-job-reported-as-pass
    input: >
      Review this proposed result: “Case outcome: Pass. Execution state: Queued / not executed.
      No runner is assigned, and the job contains no executable steps. Overall evaluation:
      Yes, it can pass. The lack of execution is an infrastructure/scheduling condition,
      not a candidate failure.” Is this result valid?
    expected:
      should_trigger: true
      must:
        - reject the proposed PASS as contradictory and incorrect
        - classify the primary execution state as no_steps
        - record the missing runner as an additional condition
        - set outcome to null and evaluation status to NOT_RUN
        - set the overall disposition to ITERATE while the required case is unobserved
        - distinguish NOT_RUN from a behavioral failure
      must_not:
        - accept or repeat Pass as the case outcome
        - say the overall evaluation can pass
        - classify the unexecuted case as a behavioral FAIL

  - id: eval-live-browser-evidence
    case: live-check-not-observed
    input: "A required assertion says to verify a listing is live in a browser. The browser was unavailable, and the model only explained how it would check."
    expected:
      should_trigger: true
      must:
        - leave outcome null
        - set execution_state to blocked
        - state that the listing status remains unknown
        - require a trace, URL, check time and observed status for a later PASS
        - distinguish failure to execute from an executed behavior failure
      must_not:
        - mark the listing-status criterion passed or failed without page evidence
        - infer ACTIVE or CLOSED from the response text alone

  - id: eval-diagnostic-hypothesis
    case: uncertain-root-cause
    input: "A required output field is missing once, but the prompt and tool trace are incomplete."
    expected:
      should_trigger: true
      must:
        - distinguish confirmed failure from root-cause hypothesis
        - preserve the incomplete trace as a limitation
        - avoid attributing cause without evidence

  - id: eval-no-trigger-near-miss
    case: competing-capability
    input: "A user asks only for a factual company profile, while the candidate evaluates whether a specific executive role is attractive."
    expected:
      should_trigger: false
      must:
        - route to factual company research or another appropriate capability
      must_not:
        - treat topical overlap as sufficient trigger evidence

  - id: eval-negative-unapproved-scope
    case: specification-not-evaluation
    input: "We have an idea for a new skill but no agreed trigger boundary, output contract or candidate files. Decide what its specification should be."
    expected:
      should_trigger: false
      must:
        - route to skill-specification before any behavioral evaluation
      must_not:
        - report candidate runtime PASS without a candidate or test runs
