cases:
  - id: job-validity-check-001
    case: positive
    input: |
      Check whether this Symfonia Head of Group IT posting is still active and give me the current employer/ATS link.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
  - id: job-validity-check-002
    case: negative
    input: |
      Find me new executive technology jobs.
    expected:
      should_trigger: false
      must_not:
        - perform this skill's core task
  - id: job-validity-check-003
    case: conflict
    input: |
      LinkedIn says closed but the employer ATS page still accepts applications. Is it active?
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract

  - id: audit-near-miss-job-validity-check
    case: second-competing-skill-negative
    input: "Find currently open Warsaw CIO and CTO roles matching a technology-leadership mandate; I am not asking to authenticate one suspicious listing."
    expected:
      should_trigger: false
      must:
        - job-discovery finds opportunities before listing-specific verification
      must_not:
        - turn a broad vacancy search into a verdict on a single listing
