cases:
  - id: cv-tailoring-001
    case: positive
    input: |
      Tailor my mastery CV to this Deputy CIO role using only facts already in the base CV.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
  - id: cv-tailoring-002
    case: negative
    input: |
      Tell me which experience gaps I have for this role.
    expected:
      should_trigger: false
      must_not:
        - perform this skill's core task
  - id: cv-tailoring-003
    case: fabrication
    input: |
      Add that I owned a 300-person org even though my CV does not say that.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
  - id: cv-tailoring-004-source-precedence
    case: source_integrity
    input: |
      Approved mastery CV: I managed a team of 12 and oversaw a portfolio; it gives no project count and no organization-wide headcount.
      An older tailored draft says I led a 300-person organization and oversaw 60 projects.
      Tailor my CV for a Deputy CIO role using the mastery CV.
    expected:
      should_trigger: true
      must:
        - use the approved mastery CV as the only source of candidate facts
        - not repeat 300-person organization or 60-project claims from the older draft
        - preserve the supported team size of 12 and distinguish it from portfolio scope
        - mark missing scale claims as omitted or awaiting confirmation
        - include a concise source check and change log

  - id: audit-near-miss-cv-tailoring
    case: second-competing-skill-negative
    input: "Before editing any CV content, compare my approved career history to this CTO description and identify missing proof and weak claims."
    expected:
      should_trigger: false
      must:
        - cv-gap-analysis first establishes evidence gaps before tailoring
      must_not:
        - rewrite an unapproved CV or fill gaps with invented achievements
