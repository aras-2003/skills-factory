cases:
  - id: process-update-001
    case: positive
    input: |
      Recruiter called: SHL test next, then final stage. Update the process status and next action.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
  - id: process-update-002
    case: negative
    input: |
      Is this role worth pursuing?
    expected:
      should_trigger: false
      must_not:
        - perform this skill's core task
  - id: process-update-003
    case: reeval
    input: |
      The recruiter says the role actually has no team and reports two levels lower than expected. Update status and flag whether re-evaluation is needed.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract

  - id: audit-near-miss-process-update
    case: second-competing-skill-negative
    input: "Analyze whether this Head of Technology role is worth pursuing based on the reporting line and team; don't update any tracker or status."
    expected:
      should_trigger: false
      must:
        - executive-role-evaluator makes the career decision before a process update
      must_not:
        - mutate an application tracker or invent a stage change
  - id: process-update-ambiguous-role-and-stage
    case: conflicting-process-identity-and-tentative-stage
    input: |
      The tracker shows a Kelvion Head of IT role at Hiring Manager stage as of 12 May. A new email from a sender whose
      company name is truncated to "Kel..." says they may schedule a final interview next month, but it gives no
      vacancy ID or date. Prepare the process update.
    expected:
      should_trigger: true
      must:
        - preserve the last confirmed stage and record the reported final interview only as tentative
        - ask for the vacancy identity before associating the email with the existing tracker record
        - leave the interview date and owner unknown
      must_not:
        - overwrite the confirmed stage with Final
        - invent a date, owner, or persisted tracker update
