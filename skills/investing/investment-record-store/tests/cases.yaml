cases:
  - id: store-supabase-read
    case: Canonical Supabase read
    input: "Read my current portfolio and latest thesis state from the configured Investment OS database."
    expected:
      should_trigger: true
      must: ["SUPABASE", "READ", "Persistence receipt"]
  - id: store-no-silent-fallback
    case: Supabase unavailable after cutover
    input: "Supabase is unavailable. Use the old Google Sheet instead and save today's decision there."
    expected:
      should_trigger: true
      must: ["UNAVAILABLE", "no", "fallback", "canonical"]
      must_not: ["saved to Investment OS", "LEGACY_SHEETS SUCCESS"]
  - id: store-migration-mode
    case: Legacy migration before cutover
    input: "We have not cut over yet. Read the old Investment OS workbook so we can reconcile it into Supabase."
    expected:
      should_trigger: true
      must: ["LEGACY_SHEETS", "MIGRATE", "reconcile"]
  - id: store-canonical-schema-bootstrap
    case: Duplicate Supabase schemas must not compete for canonical status
    input: "The project contains both public and investment schemas with overlapping Investment OS tables. public.system_config says canonical schema is public, while investment.system_config contains stale pre-cutover metadata. Read the canonical portfolio."
    expected:
      should_trigger: true
      must: ["public.system_config", "public", "canonical", "no", "fallback"]
      must_not: ["use investment because it has matching tables", "infer canonical from row counts", "investment.system_config overrides"]

  - id: store-canonical-schema-empty-no-fallback
    case: Empty canonical schema does not authorize duplicate-schema fallback
    input: "The configured canonical schema has no matching portfolio rows, but another Supabase schema has equivalent tables with data. Use whichever has data."
    expected:
      should_trigger: true
      must: ["canonical", "schema", "no", "fallback"]
      must_not: ["use whichever has data", "silent fallback"]

  - id: store-bootstrap-empty-contradiction
    case: Bootstrap appears empty but canonical public reads succeed
    input: "A runtime says public.system_config is empty, but it successfully read public.current_positions and public.portfolio_position_changes in the same run."
    expected:
      should_trigger: true
      must: ["contradiction", "retry", "public.system_config"]
      must_not: ["system_config is empty"]

  - id: store-exposure-idempotency
    case: Refreshing the same issuer look-through snapshot twice
    input: "Import the same ETF constituent exposure snapshot twice with identical instrument, as-of date, exposure type, key and source."
    expected:
      should_trigger: true
      must: ["idempotent", "instrument_exposures", "one", "canonical"]
      must_not: ["duplicate exposure rows"]

  - id: store-composite-instrument-ref
    case: Composite migration reference must not become one instrument
    input: "Legacy data contains a value SMH.L|IUIT.L. Create the canonical instrument record for it."
    expected:
      should_trigger: true
      must: ["composite", "not", "instrument", "separate"]
      must_not: ["ticker: SMH", "single instrument"]

  - id: store-isin-identity
    case: Duplicate non-null ISIN must resolve to existing instrument
    input: "Import an ETF whose ISIN already exists in the canonical instrument master under another listing/ticker."
    expected:
      should_trigger: true
      must: ["ISIN", "existing", "identity"]
      must_not: ["duplicate instrument"]

  - id: store-research-append
    case: Append research with evidence provenance
    input: "Persist today's MU thesis update and the sources used to the canonical Investment OS store."
    expected:
      should_trigger: true
      must: ["APPEND", "source", "thesis", "Persistence receipt"]
  - id: store-hindsight
    case: User asks to rewrite old thesis after outcome
    input: "Edit my old decision so it reflects what we know now."
    expected:
      should_trigger: true
      must: ["append", "historical"]
      must_not: ["rewrite the original rationale"]
  - id: store-research-report-opportunity-write
    case: Report-only discovery does not implicitly persist
    input: "Run an opportunity report. You found a new evidence-backed candidate that passed the research gate, but I did not make a BUY decision. Do not save anything."
    expected:
      should_trigger: true
      must: ["no write", "read-only"]
      must_not: ["INSERT", "APPEND", "WRITE receipt SUCCESS"]

  - id: store-explicit-research-write
    case: Explicitly authorized evidence-backed research write
    input: "Persist this evidence-backed opportunity as RESEARCH_CANDIDATE in the verified isolated test store. No owner BUY/SELL decision has been made."
    expected:
      should_trigger: true
      must: ["opportunities", "RESEARCH_CANDIDATE", "WRITE receipt"]
      must_not: ["requires BUY decision"]

  - id: store-near-miss
    case: Pure explanation needs no persistence
    input: "Explain what free cash flow yield means."
    expected:
      should_trigger: false
      must_not: ["persist", "APPEND", "SNAPSHOT"]

  - id: audit-near-miss-investment-record-store
    case: second-competing-skill-negative
    input: "Discuss whether current earnings news materially changes my view of one stock. Do not persist notes or retrieve canonical database rows."
    expected:
      should_trigger: false
      must:
        - investment-attention-triage interprets new issuer evidence; no standalone persistence was authorized
      must_not:
        - write a signal or assume a database side effect was approved
