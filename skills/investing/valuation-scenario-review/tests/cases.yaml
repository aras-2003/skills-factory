cases:
  - id: valuation-direct
    case: Scenario valuation
    input: "Value MU under bear, base and bull assumptions and show what the current price implies."
    expected:
      should_trigger: true
      must: ["bear", "base", "bull", "implies"]
  - id: valuation-cycle
    case: Cyclical normalization
    input: "Do not use peak EPS mechanically; normalize the cycle and show valuation sensitivity."
    expected:
      should_trigger: true
      must: ["cycle", "sensitivity"]
  - id: valuation-near-miss
    case: Theme discovery
    input: "Map the datacenter power value chain."
    expected:
      should_trigger: false
      must_not: ["bear", "base", "bull"]

  - id: audit-near-miss-valuation-scenario-review
    case: second-competing-skill-negative
    input: "There is no defined company or cash-flow model. Research the second-order beneficiaries of European grid modernization."
    expected:
      should_trigger: false
      must:
        - trend-theme-research develops theme candidates before per-security valuation
      must_not:
        - fabricate inputs or a fair value for an unnamed stock

  - id: valuation-card-missing-critical-input
    case: No numeric card from missing statements
    input: "Create a bear/base/bull valuation card for a developer, but I only have the ticker and current price."
    expected:
      should_trigger: true
      must: ["NOT_SCORED", "NAV", "missing", "source"]
      must_not: ["invent", "numeric fair value"]

  - id: valuation-card-mos-versus-upside
    case: Distinguish margin of safety from upside
    input: "Fair value is 100 and price is 80. Show both margin of safety and upside, with the formulas."
    expected:
      should_trigger: true
      must: ["20%", "25%", "margin of safety", "upside"]

  - id: valuation-card-industry-method
    case: Choose method for REIT
    input: "Value this REIT from verified AFFO per share and a justified P/AFFO range; do not use a generic P/E multiple."
    expected:
      should_trigger: true
      must: ["AFFO", "P/AFFO", "alternatives", "source"]

  - id: valuation-card-property-developer
    case: Property developer NAV
    input: "Value this property developer from independently verified asset value, project liabilities and diluted shares; show NAV per share and asset/liability sensitivity."
    expected:
      should_trigger: true
      must: ["NAV", "asset value", "liabilities", "diluted shares", "sensitivity"]
      must_not: ["generic P/E only"]

  - id: valuation-card-financial-method
    case: Financial-sector residual income
    input: "For this bank, use verified book value and through-cycle ROE in a residual-income model; compare the cost of equity and show sensitivity."
    expected:
      should_trigger: true
      must: ["residual income", "book value", "ROE", "cost of equity", "sensitivity"]

  - id: valuation-card-levered-telecom
    case: Leverage-aware telecom valuation
    input: "Value this highly leveraged telecom using normalized cash flows, debt maturities, refinancing stress and diluted shares; show the equity bridge."
    expected:
      should_trigger: true
      must: ["cash flow", "maturities", "refinancing", "diluted shares", "equity bridge"]

  - id: valuation-card-no-lookahead
    case: Future-published data excluded from an as-of valuation
    input: "As of 2026-06-30, value TEST-ASOF using information available by that timestamp only. The annual filing for the year ended 2025-12-31 was published 2026-03-15; a quarterly update for period ended 2026-06-30 was published 2026-08-15. Exclude the later filing from the as-of valuation and state why."
    expected:
      should_trigger: true
      must: ["as-of", "2026-06-30", "2026-03-15", "exclude", "2026-08-15"]
      must_not: ["use the later filing", "future data as known"]
