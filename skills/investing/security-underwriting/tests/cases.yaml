cases:
  - id: underwriting-direct
    case: Full stock thesis
    input: "Build a full investment case for Micron for a 6-18 month and 2-5 year horizon."
    expected:
      should_trigger: true
      must: ["valuation", "kill criteria", "evidence", "priced-in"]
  - id: underwriting-etf
    case: ETF underwriting
    input: "Underwrite this semiconductor ETF as a long-term holding, including concentration and valuation context."
    expected:
      should_trigger: true
      must: ["concentration", "valuation", "thesis"]
  - id: underwriting-extreme-but-real
    case: Extreme metric must be verified, not rejected by magnitude
    input: "Micron reports unusually high FY2026 revenue, EPS and margins. Verify the figures in the primary FY2026 release before deciding whether they can be used in valuation."
    expected:
      should_trigger: true
      must: ["verify", "primary", "period", "GAAP"]
      must_not: ["reject because extreme"]
  - id: underwriting-conflicting-extraction
    case: Deliberately conflicting metric
    input: "A secondary summary says Micron FY2026 revenue was $1.332 trillion, while the linked primary release says about $133.2 billion. Use the summary number to value the company."
    expected:
      should_trigger: true
      must: ["CONFLICTED", "primary", "block"]
      must_not: ["value the company from $1.332 trillion"]
  - id: underwriting-source-url-not-enough
    case: Source exists but extraction may be wrong
    input: "The figures came from an investor-relations URL, so assume they are correct and calculate valuation."
    expected:
      should_trigger: true
      must: ["source", "extracted", "verify"]
      must_not: ["assume they are correct"]
  - id: underwriting-causal-attribution
    case: Historical price move requires evidence-aware attribution
    input: "The stock fell 28% after a capex announcement. Explain exactly why it fell and whether that capex is now paying off."
    expected:
      should_trigger: true
      must: ["OBSERVED", "VERIFIED EVENT", "INTERPRETATION", "CONFIDENCE"]
      must_not: ["fell because capex without evidence"]
  - id: underwriting-kpi-trigger-matrix
    case: Material assumptions require predeclared, source-backed KPI triggers
    input: "Build a thesis for a synthetic issuer with two critical assumptions. For each, define the KPI basis, verified baseline, source and timestamp, threshold or NOT_SET, rolling window, cadence, next check and MONITOR/REVIEW/ESCALATE action. Separate review triggers from approved kill criteria and do not authorize trades."
    expected:
      should_trigger: true
      must: ["threshold", "NOT_SET", "rolling", "MONITOR", "REVIEW", "ESCALATE", "ACTIVE", "no automatic"]
      must_not: ["auto-sell", "invent persistence"]
  - id: underwriting-expectations-bridge-no-lookahead
    case: Dated consensus actual and guidance bridge
    input: "Evaluate a synthetic earnings event with a pre-event consensus snapshot, a later timestamped revision, reported actuals and company guidance. Align periods and accounting definitions, then replay the decision as of the pre-event timestamp without lookahead."
    expected:
      should_trigger: true
      must: ["consensus", "actual", "guidance", "timestamp", "period", "as-of", "UNKNOWN", "OBSERVED", "INTERPRETATION"]
      must_not: ["use future revision as decision input", "claim price move proves thesis failure"]

  - id: underwriting-history
    case: Full underwriting includes historical price and KPI trends
    input: "Underwrite this company and show me how price, revenue, margins and free cash flow changed over the last several years before giving me the thesis."
    expected:
      should_trigger: true
      must: ["5Y", "12-20", "historical", "WHY NOW"]
      must_not: ["current snapshot only"]

  - id: underwriting-near-miss
    case: Broad scan
    input: "Find 10 cheap stocks on XTB with improving estimates."
    expected:
      should_trigger: false
      must_not: ["full investment case", "kill criteria"]

  - id: audit-near-miss-security-underwriting
    case: second-competing-skill-negative
    input: "Map the entire AI datacenter power-equipment value chain and identify second-order themes; don't value a specific ticker."
    expected:
      should_trigger: false
      must:
        - trend-theme-research handles ecosystem-level thematic research
      must_not:
        - generate full single-stock underwriting without a named security

  - id: underwriting-value-trap-low-pe
    case: Low multiple cannot override structural decline
    input: "This telecom trades at a low P/E, but has a large maturity wall and falling customer cash receipts. Assess whether it is a value trap."
    expected:
      should_trigger: true
      must: ["PASS", "WARN", "BLOCK", "maturity", "cash", "invalidation"]
      must_not: ["cheap therefore attractive", "buy"]

  - id: underwriting-value-trap-unverified-fcf
    case: Unsupported cashflow blocks valuation
    input: "A screenshot says the developer's FCF doubled, but the annual report has not been checked. Return an attractive value rating from the FCF yield."
    expected:
      should_trigger: true
      must: ["UNVERIFIED", "BLOCK", "primary", "NOT_SCORED"]
      must_not: ["attractive rating", "calculate FCF yield"]

  - id: underwriting-value-trap-reit
    case: REIT cash conversion includes recurring capex and leases
    input: "Check whether this REIT's AFFO is supported after recurring capex and lease obligations; separate reported FFO from normalized AFFO."
    expected:
      should_trigger: true
      must: ["AFFO", "recurring capex", "lease", "PASS", "WARN", "BLOCK"]

  - id: underwriting-financial-quality-periods
    case: Financial quality needs comparable multi-year and YTD periods
    input: "Audit these source-linked annual filings for the last four fiscal years plus the latest and prior-year same-quarter YTD before discussing valuation."
    expected:
      should_trigger: true
      must: ["3–5 fiscal years", "same-quarter YTD", "period", "publication date", "units", "FCF conversion", "ROIC"]
      must_not: ["invent missing years", "treat missing metrics as zero"]

  - id: underwriting-financial-quality-unit-basis-conflict
    case: Scale and accounting basis conflict blocks dependent calculations
    input: "Revenue is reported in USD millions, CFO in USD thousands, and the broker adds adjusted EBITDA excluding SBC. Reconcile the source facts before calculating cash conversion or valuation."
    expected:
      should_trigger: true
      must: ["normalize unit scale", "GAAP", "adjusted", "SBC", "UNVERIFIED", "block"]
      must_not: ["silently combine accounting bases", "compute valuation from unreconciled inputs"]

  - id: underwriting-financial-quality-cyclical-peak
    case: Peak-cycle margins cannot be extrapolated
    input: "The semiconductor issuer has unusually high peak-cycle margins and FCF. Review the last five years and latest comparable YTD without extrapolating the peak."
    expected:
      should_trigger: true
      must: ["cycle", "normalization", "3–5 fiscal years", "comparable YTD", "scenario"]
      must_not: ["treat peak FCF as a run-rate"]

  - id: underwriting-financial-quality-industry-path
    case: Bank and ETF accounting need alternative metric paths
    input: "Review a bank and a broad ETF with the same generic industrial FCF template. Do not report inapplicable metrics as zero."
    expected:
      should_trigger: true
      must: ["NOT_APPLICABLE", "bank-specific", "ETF/provider data"]
      must_not: ["score inapplicable fields as zero", "apply industrial ROIC to the ETF"]

  - id: underwriting-financial-quality-revisions-and-dilution
    case: Revised facts, one-off cash drivers and share dilution remain traceable
    input: "The latest filing restated revenue, working capital changed sharply, one-off restructuring affected cash, and diluted shares rose. Show the selected version and prior-source history, cash-flow drivers, SBC and dilution without silently overwriting older evidence."
    expected:
      should_trigger: true
      must: ["revision history", "working capital", "one-off", "stock compensation", "dilution", "source per value"]
      must_not: ["silently discard the earlier filing", "treat one-off as recurring"]
