cases:
  - id: challenge-direct
    case: Challenge existing bullish thesis
    input: "My thesis is that HBM demand will rerate Micron. Try to break it before I add."
    expected:
      should_trigger: true
      must: ["countercase", "priced-in", "revised thesis state"]
  - id: challenge-confirmation
    case: Confirmation bias explicit
    input: "I like this stock a lot; find the strongest evidence that I may be wrong."
    expected:
      should_trigger: true
      must: ["contradictory evidence", "countercase"]
  - id: challenge-near-miss
    case: No thesis exists
    input: "What does Micron do?"
    expected:
      should_trigger: false
      must_not: ["revised thesis state", "priced-in analysis"]

  - id: audit-near-miss-thesis-challenge
    case: second-competing-skill-negative
    input: "I have no thesis for this issuer yet. Build an initial fundamental view from its filings and plausible assumptions."
    expected:
      should_trigger: false
      must:
        - security-underwriting establishes an initial thesis before challenge
      must_not:
        - pretend a prior bullish thesis exists to attack
