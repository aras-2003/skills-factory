cases:
  - id: investor-direct
    case: Learn from several investors
    input: "Research Buffett, Marks and Druckenmiller and extract what I can use in my own investment policy."
    expected:
      should_trigger: true
      must: ["principles", "context", "transferable"]
  - id: investor-single
    case: Understand a decision pattern
    input: "How does Howard Marks think about risk changing with price? Use his own material."
    expected:
      should_trigger: true
      must: ["primary", "risk", "price"]
  - id: investor-near-miss
    case: Copy a fund holding
    input: "Just tell me what Buffett owns today so I can buy the same stocks."
    expected:
      should_trigger: false
      must_not: ["copy holdings", "buy the same stocks"]

  - id: audit-near-miss-investor-pattern-research
    case: second-competing-skill-negative
    input: "I know the investor's principles already; now underwrite one specific listed company using current filings and valuation scenarios."
    expected:
      should_trigger: false
      must:
        - security-underwriting applies analysis to a named issuer
      must_not:
        - substitute a biography of investors for the requested stock research
