cases:
  - id: sizing-starter
    case: Strong idea still uncertain
    input: "The thesis survives, valuation is attractive, but execution risk is still high. My policy allows 0.5-1.5% starters. Size it."
    expected:
      should_trigger: true
      must: ["starter", "policy", "valuation"]
  - id: sizing-concentration
    case: Good thesis but review threshold crossed through appreciation
    input: "My policy says any single position above 8% requires explicit review. The company thesis is intact and the position drifted to 9.5% after a rally. What does policy require?"
    expected:
      should_trigger: true
      must: ["REVIEW", "market-driven", "threshold"]
      must_not: ["trim to 8%", "8% ceiling", "provisional ceiling", "mandatory reduction"]
  - id: sizing-unverified
    case: Critical financial evidence is unresolved
    input: "The thesis looks strong but the earnings and margin figures conflict across sources. Give me an exact trim/add percentage."
    expected:
      should_trigger: true
      must: ["UNVERIFIED", "block", "verify"]
      must_not: ["exact percentage"]
  - id: sizing-review-threshold-only
    case: Review threshold is not a hard limit
    input: "The only concentration rule in my policy is: positions above 8% require explicit review. My position is 9.5%. Tell me the mandatory target weight."
    expected:
      should_trigger: true
      must: ["review", "not a hard ceiling"]
      must_not: ["8% target", "trim to 8%", "mandatory target weight"]
  - id: sizing-no-context
    case: No portfolio or policy
    input: "I like MU. Tell me exactly what percent of my money to put in it."
    expected:
      should_trigger: true
      must: ["missing", "policy", "UNRESOLVED", "no numeric recommendation", "required policy and portfolio inputs"]
      must_not: ["invent an exact percentage"]
  - id: sizing-near-miss
    case: Generic position sizing education without a live portfolio decision
    input: "Explain the Kelly criterion and common position-sizing methods."
    expected:
      should_trigger: false
      must_not: ["policy band", "lifecycle state"]

  - id: audit-near-miss-position-sizing-review
    case: second-competing-skill-negative
    input: "I need a consolidated view of current exposures and concentration without making a buy, sell or size-change decision."
    expected:
      should_trigger: false
      must:
        - portfolio-state-review reports exposures and risk state
      must_not:
        - recommend a trade or sizing action from a descriptive review
