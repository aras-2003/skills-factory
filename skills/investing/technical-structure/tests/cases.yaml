cases:
  - id: technical-structure-synthetic-known-answer
    case: Synthetic adjusted bars produce a bounded confirmed-structure result
    input: |
      For technical structure / Dow Theory (OPS/OPD), use only the following explicitly synthetic adjusted OHLCV daily bars and compute one supplied-window state with the default two left/two right confirmation bars. Currency is USD. Dates represent 00:00 UTC and each bar's published_at equals its timestamp. Label the result synthetic. Source series: SYNTHETIC-XYZ-DAILY-v1; adjustment ID: synthetic-adjustment-v1; as of 2026-01-11T00:00:00+00:00. Do not make an investment recommendation or claim real-market evidence.

      | timestamp / published_at (UTC) | open | high | low | close | volume | source_id |
      | --- | ---: | ---: | ---: | ---: | ---: | --- |
      | 2026-01-01 | 9 | 10 | 8 | 9 | 100 | SYNTHETIC-XYZ-0 |
      | 2026-01-02 | 11 | 12 | 9 | 11 | 100 | SYNTHETIC-XYZ-1 |
      | 2026-01-03 | 12 | 14 | 10 | 12 | 100 | SYNTHETIC-XYZ-2 |
      | 2026-01-04 | 10 | 12 | 9 | 10 | 100 | SYNTHETIC-XYZ-3 |
      | 2026-01-05 | 9 | 11 | 8 | 9 | 100 | SYNTHETIC-XYZ-4 |
      | 2026-01-06 | 13 | 14 | 10 | 13 | 100 | SYNTHETIC-XYZ-5 |
      | 2026-01-07 | 15 | 16 | 11 | 15 | 100 | SYNTHETIC-XYZ-6 |
      | 2026-01-08 | 12 | 14 | 10 | 12 | 100 | SYNTHETIC-XYZ-7 |
      | 2026-01-09 | 11 | 13 | 9 | 11 | 100 | SYNTHETIC-XYZ-8 |
      | 2026-01-10 | 11 | 12 | 10 | 11 | 100 | SYNTHETIC-XYZ-9 |
      | 2026-01-11 | 11 | 12 | 10 | 11 | 100 | SYNTHETIC-XYZ-10 |
    expected:
      should_trigger: true
      must: ["synthetic", "USD", "UPTREND", "UPTREND_CONTINUATION", "supplied-window-only", "OPS 16", "confirmed 2026-01-09", "SYNTHETIC-XYZ-6", "45.45%", "OPD 9", "confirmed 2026-01-11", "SYNTHETIC-XYZ-8", "-18.18%", "score 100", "not a probability"]
      must_not: ["real market observation", "investment recommendation", "predictive edge"]

  - id: technical-structure-confirmed
    case: Summarize supplied confirmed adjusted swing structure
    input: "Using only these adjusted OHLCV bars and source IDs, report confirmed OPS/OPD, trend state, distances and invalidation."
    expected:
      should_trigger: true
      must: ["confirmed", "adjusted", "OPS", "OPD", "invalidation", "not a probability"]
  - id: technical-structure-no-lookahead
    case: Unconfirmed pivot remains unavailable
    input: "The apparent swing high has not yet had its two right-side confirmation bars. Show it as confirmed OPS anyway."
    expected:
      should_trigger: true
      must: ["UNKNOWN", "not confirmed", "right-side bars"]
      must_not: ["backdate the pivot", "confirmed OPS"]
  - id: technical-structure-missing-adjustment
    case: Unadjusted prices do not support long-horizon structure
    input: "These raw prices cross a stock split and have no adjustment metadata. Give the long-term trend and OPS/OPD."
    expected:
      should_trigger: true
      must: ["UNKNOWN", "adjustment", "source"]
      must_not: ["invent adjusted history"]
  - id: technical-structure-near-miss
    case: Fundamental valuation request stays with underwriting
    input: "Review this company's valuation and earnings quality; do not analyze price swings."
    expected:
      should_trigger: false
      must_not: ["OPS/OPD", "trend invalidation"]
  - id: technical-structure-fundamentals-near-miss
    case: A fundamentals-only request is not technical structure
    input: "Evaluate this company's earnings quality, balance sheet and valuation; do not inspect price structure."
    expected:
      should_trigger: false
      must_not: ["OPS/OPD", "price trend", "support and resistance"]
