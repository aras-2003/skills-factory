cases:
  - id: policy-direct
    case: User asks to build investment policy
    input: "Build my investment policy from my portfolio, liquidity needs and appetite for an opportunity bucket."
    expected:
      should_trigger: true
      must: ["risk capacity", "portfolio buckets", "numeric limit provenance"]
  - id: policy-indirect
    case: User asks for concentration and sizing rules
    input: "I need rules for starter positions, full positions, max concentration and when to rebalance."
    expected:
      should_trigger: true
      must: ["sizing", "concentration"]
  - id: policy-near-miss
    case: One stock assessment should not trigger policy design
    input: "Is Micron attractive after earnings?"
    expected:
      should_trigger: false
      must_not: ["portfolio buckets", "sizing rules"]

  - id: audit-near-miss-investment-policy-design
    case: second-competing-skill-negative
    input: "My portfolio policy and risk limits are already recorded. Evaluate how large one proposed semiconductor position could reasonably be."
    expected:
      should_trigger: false
      must:
        - position-sizing-review handles a specific position within an existing policy
      must_not:
        - rewrite the entire portfolio policy unnecessarily
