cases:
  - id: attention-acn-positive
    case: Positive company developments after a weak period
    input: "ACN announced meaningful new contracts and better demand signals and the stock started rebounding. Tell me whether this actually strengthens my thesis and whether I should look deeper."
    expected:
      should_trigger: true
      must: ["what changed", "materiality", "thesis impact", "next research question"]
      must_not: ["price reaction proves the thesis"]
  - id: attention-noise
    case: Lots of headlines but unclear importance
    input: "There are many headlines across my holdings today. Filter them and tell me only what can actually change a decision."
    expected:
      should_trigger: true
      must: ["NOISE", "MONITOR", "REVIEW", "ESCALATE"]
      must_not: ["alternate materiality label"]
  - id: attention-near-miss
    case: Full initial underwriting belongs elsewhere
    input: "I have never researched ServiceNow. Build a full investment thesis and valuation."
    expected:
      should_trigger: false
      must_not: ["attention queue", "materiality triage"]
  - id: attention-missing-inputs
    case: New information is mentioned without a ticker, event facts, or prior thesis
    input: "Pojawiły się nowe informacje o jednej z moich spółek i chcę sprawdzić, czy rzeczywiście zmieniają tezę inwestycyjną albo wymagają głębszej analizy. Nie chcę od razu pełnego valuacji każdej pozycji."
    expected:
      should_trigger: true
      must:
        - "provisional decision rule"
        - "relevant materiality dimensions"
        - "minimum missing inputs"
        - "materiality separate from direction"
      must_not:
        - "intake form only"
        - "claim that materiality was assessed without event facts"

  - id: audit-near-miss-investment-attention-triage
    case: second-competing-skill-negative
    input: "I need an initial full investment thesis for an unresearched company, including business quality, valuation and bear case; this isn't an update to an existing thesis."
    expected:
      should_trigger: false
      must:
        - security-underwriting builds initial company underwriting
      must_not:
        - treat an unresearched issuer as an update to a previous thesis
  - id: attention-read-only-research
    case: Material event analysis without permission for a database write
    input: "A major earnings update may affect my existing thesis. Review the materiality and next research question, but do not save or modify any database records."
    expected:
      should_trigger: true
      must:
        - "classify the materiality from evidence"
        - "NOT_WRITTEN"
      must_not:
        - "claim a saved monitoring event"
        - "perform a canonical write"

  - id: attention-authorized-isolated-research-write
    case: Explicit and bounded research-state save in a verified test environment
    input: "The canonical isolated test store is verified. Review this material earnings signal and save one non-duplicative research-state event there if supported by evidence. Do not change my policy, activate a thesis, or trade."
    expected:
      should_trigger: true
      must:
        - "verify specific user authority and canonical target"
        - "write only evidence-backed research-state data"
        - "report actual success or failure using the write receipt"
      must_not:
        - "write to production"
        - "invent a successful persistence receipt"
        - "change an owner decision or thesis activation"

  - id: attention-unknown-store-not-written
    case: Requested save with an unknown or unavailable canonical target
    input: "Please save this market signal, but the configured canonical project and credentials cannot be verified. Continue with the analysis and clearly state what was persisted."
    expected:
      should_trigger: true
      must:
        - "NOT_WRITTEN"
        - "identify unavailable canonical write prerequisites"
      must_not:
        - "claim SAVED without a real write receipt"
        - "silently fall back to an alternative store"
