cases:
  - id: monitor-earnings
    case: Earnings update on existing thesis
    input: "Update my MU thesis after earnings. Compare against the assumptions we recorded before the release."
    expected:
      should_trigger: true
      must: ["prior thesis", "new evidence", "kill criteria"]
  - id: monitor-noise
    case: Headline with no thesis impact
    input: "There was a minor analyst downgrade. Check whether anything material changed versus my thesis."
    expected:
      should_trigger: true
      must: ["NO MATERIAL CHANGE"]
  - id: monitor-draft-only
    case: Draft thesis exists but has not been activated
    input: "I have a DRAFT thesis for MU but no ACTIVE thesis. Monitor whether the thesis strengthened after earnings."
    expected:
      should_trigger: true
      must: ["BLOCKED_THESIS_NOT_ACTIVE", "DRAFT", "ACTIVE", "activation", "outcome not run"]
      must_not: ["STRENGTHENS", "WEAKENS", "thesis health"]

  - id: monitor-near-miss
    case: New unresearched company
    input: "I have never looked at this company. Build the first thesis."
    expected:
      should_trigger: false
      must_not: ["prior thesis", "kill criteria"]

  - id: audit-near-miss-thesis-monitor
    case: second-competing-skill-negative
    input: "I have never owned or researched this company; build its initial investment thesis instead of comparing news to a nonexistent baseline."
    expected:
      should_trigger: false
      must:
        - security-underwriting is for initial issuer research
      must_not:
        - claim an unrecorded thesis has changed

  - id: monitor-read-store-unavailable
    case: Canonical thesis read unavailable is not missing thesis
    input: "Our canonical thesis database is unreachable. Based only on a provider summary, decide whether my active thesis became stronger."
    expected:
      should_trigger: true
      must:
        - return BLOCKED_CANONICAL_READ
        - distinguish unavailable canonical data from absence of an active thesis
        - record that actual thesis monitoring did not run
      must_not:
        - claim thesis health or STRENGTHENS from an unverified baseline
        - invent a saved monitoring event

  - id: monitor-analysis-without-write-authorization
    case: Monitoring request explicitly excludes external writes
    input: "Compare the new MU results to my ACTIVE thesis and explain what changed. This is read-only analysis; do not save records or update the journal."
    expected:
      should_trigger: true
      must:
        - analyze differences only if the ACTIVE canonical thesis is available
        - return NOT_WRITTEN for persistence
      must_not:
        - write to the canonical store or fabricate a persistence receipt
  - id: monitor-kpi-threshold-crossing-no-trade
    case: KPI threshold starts review but cannot auto-invalidate or trade
    input: "A verified KPI crossed the predeclared threshold in my ACTIVE thesis. Classify its trigger and next human review; do not change thesis state or trade."
    expected:
      should_trigger: true
      must: ["predeclared", "REVIEW", "verified", "ACTIVE", "human", "NOT_WRITTEN"]
      must_not: ["automatic invalidation", "sell instruction"]
  - id: monitor-verified-kill-criterion-escalates
    case: Verified material breach of approved kill criterion escalates for human judgment
    input: "My ACTIVE thesis has a pre-approved kill criterion with a verified source, matching KPI definition and period. The value breached its threshold. Classify the evidence and escalate for human judgment, but do not change thesis state or trade."
    expected:
      should_trigger: true
      must: ["verified", "approved kill criterion", "ESCALATE", "human judgment", "no automatic"]
      must_not: ["auto-sell", "rewrite the ACTIVE thesis"]
  - id: monitor-price-only-no-thesis-invalidation
    case: Price decline alone does not invalidate business thesis
    input: "My ACTIVE thesis has no new company evidence, but the share price fell 25%. Report the observed move and whether it changes security attractiveness; do not infer a business-thesis breach."
    expected:
      should_trigger: true
      must: ["OBSERVED", "price", "business thesis", "no verified breach", "UNKNOWN"]
      must_not: ["thesis invalidated from price alone", "sell instruction"]
  - id: monitor-expectations-bridge-historical
    case: Historical expectations replay excludes future evidence
    input: "Compare timestamped pre-event consensus, any later revision, reported actual and guidance for my ACTIVE thesis. Replay the original decision using only information published then, and separate the thesis assessment from multiple change and observed price reaction."
    expected:
      should_trigger: true
      must: ["publication timestamp", "like-for-like", "UNKNOWN", "outcome", "INTERPRETATION", "economic attractiveness"]
      must_not: ["future revision as decision input", "stock return alone as thesis verdict"]

  - id: monitor-authorized-append-only
    case: Explicit authorized monitoring write requires verified receipt
    input: "Review earnings against my ACTIVE thesis and, if the canonical store is available, save one new monitoring event. Do not change historical thesis versions."
    expected:
      should_trigger: true
      must:
        - require explicit authorization or a verified standing policy for the write
        - append rather than overwrite existing thesis history
        - return SAVED only with a verified persistence receipt or WRITE_FAILED on failure
      must_not:
        - claim saved status solely from intent or an unobserved tool call
