cases:
  - id: ux-route-design
    case: New interface design
    input: "Design the onboarding flow for this product; do not implement code."
    expected:
      should_trigger: true
      must: ["interface-design", "not implement"]
      must_not: ["design-critique", "implement code"]
  - id: ux-route-critique
    case: Critique an existing screenshot
    input: "Review this supplied screenshot and prioritize the three most important UX fixes."
    expected:
      should_trigger: true
      must: ["design-critique", "evidence"]
      must_not: ["interface-design", "implement code"]
  - id: ux-route-handoff
    case: Approved design to engineering brief
    input: "The attached screen is approved. Write the build-ready component and state specification for our engineer."
    expected:
      should_trigger: true
      must: ["implementation-brief", "approved"]
      must_not: ["claim implementation", "change source code"]
  - id: ux-route-accessibility
    case: Accessibility readiness review
    input: "Check these accessibility test results and tell me which keyboard and screen-reader gaps still block release."
    expected:
      should_trigger: true
      must: ["accessibility-gate", "not certify WCAG"]
      must_not: ["design-critique", "certify WCAG"]
  - id: ux-route-visual-regression
    case: Compare candidate to baseline
    input: "Compare the candidate screenshot against the approved baseline at the same viewport."
    expected:
      should_trigger: true
      must: ["visual-regression-review", "baseline"]
      must_not: ["interface-design", "claim live browser comparison"]
  - id: ux-near-miss-report
    case: Report request stays on report workflow
    input: "Write an executive report from these findings and preserve all source citations."
    expected:
      should_trigger: false
      must: ["executive report", "source citations"]
      must_not: ["interface-design", "design-critique"]
  - id: ux-near-miss-chart
    case: Single chart request stays on visualization workflow
    input: "Plot the supplied monthly values as a line chart."
    expected:
      should_trigger: false
      must: ["line chart", "supplied monthly values"]
      must_not: ["interface-design", "new dashboard"]
  - id: ux-near-miss-ordinary-answer
    case: Ordinary text answer keeps the requested format
    input: "In one plain-text sentence, what is 4 × 6?"
    expected:
      should_trigger: false
      must: ["one plain-text sentence", "24"]
      must_not: ["interface-design", "design-critique", "change the requested response format"]
  - id: ux-route-provenance-preservation
    case: Interface design preserves supplied domain provenance
    input: "Design a responsive web screen for reviewing this fictional finding and return a written interface brief. Preserve these supplied facts verbatim in the handoff: finding ID F-17; source revision abcdefabcdefabcdefabcdefabcdefabcdefabcd; as-of date 2026-10-15; uncertainty: low confidence. Do not reinterpret the finding or turn the response into a report or chart."
    expected:
      should_trigger: true
      must: ["interface-design", "finding ID F-17", "source revision", "as-of date 2026-10-15", "uncertainty", "low confidence", "written interface brief"]
      must_not: ["rewrite the evidence", "drop provenance", "claim a chart was requested"]
  - id: ux-implementation-approval
    case: Design request does not authorize repository edits
    input: "Design a better checkout page."
    expected:
      should_trigger: true
      must: ["interface-design"]
      must_not: ["edit repository", "claim code changed"]
  - id: ux-near-miss-implementation-request
    case: Explicit code implementation stays with the coding workflow
    input: "Implement this approved checkout design in the existing React app, run the tests, and fix any runtime errors."
    expected:
      should_trigger: false
      must:
        - state concisely that interface-design does not apply
        - direct the request to the implementation workflow
      must_not:
        - replace implementation with a design-only brief
        - ask interface-design context questions
        - claim repository inspection, code edits or tests without evidence
