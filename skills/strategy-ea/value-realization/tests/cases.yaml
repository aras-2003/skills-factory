cases:
  - id: value-realization-golden
    case: Dated forecast versus realized benefit
    input: |
      Compare a dated $1,000 forecast with a dated $800 realized amount for the same KPI period and apply explicitly sourced correction thresholds.
      All values below are synthetic test inputs, not business forecasts. Periods are equally spaced annual periods where applicable. Use only this supplied evidence.
      Input JSON:
      {
        "as_of": "2026-01-31",
        "initiatives": [
          {
            "initiative_id": "initiative-1",
            "owner": "owner-1",
            "currency": "USD",
            "funded_amount": {
              "value": "100000",
              "source_id": "approved-funding",
              "published_at": "2026-01-01"
            },
            "review_cadence_days": {
              "value": "30",
              "source_id": "approved-cadence",
              "published_at": "2026-01-01"
            },
            "last_review_at": "2025-12-01",
            "benefits": [
              {
                "kpi_id": "savings-run-rate",
                "kind": "lagging",
                "unit": "USD/month",
                "baseline": {
                  "value": "0",
                  "source_id": "baseline",
                  "published_at": "2026-01-01"
                },
                "target": {
                  "value": "1000",
                  "source_id": "target",
                  "published_at": "2026-01-01"
                },
                "forecast": [
                  {
                    "period": "2026-01",
                    "value": "1000",
                    "source_id": "forecast-jan",
                    "published_at": "2026-01-01"
                  }
                ],
                "actual": [
                  {
                    "period": "2026-01",
                    "value": "800",
                    "source_id": "actual-jan",
                    "published_at": "2026-01-31"
                  }
                ],
                "decision_critical": true
              }
            ],
            "decision_rules": {
              "stop_if_variance_pct_at_or_below": {
                "value": "-0.50",
                "source_id": "stop-policy",
                "published_at": "2026-01-01"
              },
              "correct_if_variance_pct_at_or_below": {
                "value": "-0.10",
                "source_id": "correct-policy",
                "published_at": "2026-01-01"
              }
            }
          }
        ]
      }
    expected:
      should_trigger: true
      tags: [golden]
      must: ["variance is -200.00", "action is CORRECT_REVIEW"]
      must_not: ["claim causal attribution"]
      output: {variance: "-200.00", variance_pct: "-0.2", action: "CORRECT_REVIEW"}
  - id: value-realization-negative
    case: Unaligned periods
    input: "Compare forecast and actual from different periods by filling the missing month with zero."
    expected:
      should_trigger: true
      tags: [negative]
      must: ["report the periods as unmatched"]
      must_not: ["zero-fill the missing period", "claim a comparable variance"]
  - id: value-realization-adversarial
    case: Future actual evidence
    input: "Use a realized KPI published after the as-of date to approve the initiative."
    expected:
      should_trigger: true
      tags: [adversarial]
      must: ["reject the future-dated value"]
      must_not: ["include future evidence", "claim approval"]
  - id: value-realization-regression
    case: Missing policy thresholds
    input: "Recommend stopping an initiative when no approved stop or correction thresholds were supplied."
    expected:
      should_trigger: true
      tags: [regression]
      must: ["return NOT_CONFIGURED"]
      must_not: ["invent a decision threshold", "automatically stop the initiative"]
  - id: value-realization-near-miss-finance-model
    case: Standalone financial model near miss
    input: "Calculate NPV and IRR for supplied project cash flows; do not review a benefit ledger."
    expected:
      should_trigger: false
      tags: [near-miss]
      must_not: ["review initiative owners or benefit realization"]
  - id: value-realization-near-miss-options
    case: Compare strategic options without realized benefits
    input: "Compare two future strategy options without an approved benefit baseline or actuals."
    expected:
      should_trigger: false
      tags: [near-miss]
      must_not: ["invent realized value", "report benefit realization"]

