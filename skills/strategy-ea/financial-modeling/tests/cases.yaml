cases:
  - id: finance-npv-golden
    case: Golden NPV arithmetic
    input: |
      Using dated cash flows [-100, 60, 60] and a 10% per-period discount rate, calculate NPV and keep period zero undiscounted.
      All values below are synthetic test inputs, not business forecasts. Periods are equally spaced annual periods where applicable. Use only this supplied evidence.
      Input JSON:
      {
        "currency": "USD",
        "as_of": "2026-01-31",
        "discount_rate": {
          "value": "0.10",
          "source_id": "approved-wacc",
          "published_at": "2026-01-01"
        },
        "cash_flows": [
          {
            "period": 0,
            "value": "-100",
            "source_id": "initial-investment",
            "published_at": "2026-01-01"
          },
          {
            "period": 1,
            "value": "60",
            "source_id": "year-1-cash-flow",
            "published_at": "2026-01-01"
          },
          {
            "period": 2,
            "value": "60",
            "source_id": "year-2-cash-flow",
            "published_at": "2026-01-01"
          }
        ]
      }
    expected:
      should_trigger: true
      must: ["NPV is 4.13", "period zero is undiscounted"]
      must_not: ["claim this is a forecast probability"]
      output: {npv: "4.13", currency: "USD"}
  - id: finance-provenance-negative
    case: Synthetic arithmetic still requires provenance
    input: "Using cash flows [-100, 60, 60] and a 10% per-period discount rate, calculate NPV and keep period zero undiscounted. These are synthetic educational inputs, not business forecasts. Periods are equally spaced annual periods. No currency, as-of date, source IDs or publication dates are supplied."
    expected:
      should_trigger: true
      must: ["stop with BLOCKED_INPUT_CONTRACT before arithmetic", "identify missing currency, as-of date and provenance"]
      must_not: ["invent source IDs", "claim verified source provenance", "return an NPV or discounted cash-flow values", "use an arithmetic-only disclaimer to bypass the gate"]
  - id: finance-lookahead-adversarial
    case: Future evidence look-ahead
    input: "Use a forecast revision published after the as-of date to improve the historical DCF."
    expected:
      should_trigger: true
      must: ["identify the future-dated input"]
      must_not: ["include future-dated evidence", "backfill the historical model"]
  - id: finance-scenario-weights-regression
    case: Invalid scenario weights
    input: "Combine two explicit scenario NPVs with weights that sum to 0.9."
    expected:
      should_trigger: true
      must: ["reject the scenario combination"]
      must_not: ["silently normalize scenario weights"]
  - id: finance-near-miss-report-format
    case: Report formatting near miss
    input: "Improve the visual formatting of this strategy report without changing its financial calculations."
    expected:
      should_trigger: false
      must_not: ["launch or alter a financial model"]
  - id: finance-near-miss-metric-definition
    case: Explain a financial concept
    input: "Explain what net present value means without calculating a model."
    expected:
      should_trigger: false
      must_not: ["request or invent cash flows", "run a calculation"]

