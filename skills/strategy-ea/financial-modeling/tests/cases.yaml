cases:
  - id: finance-npv-golden
    case: Golden NPV arithmetic
    input: "Using dated cash flows [-100, 60, 60] and a 10% per-period discount rate, calculate NPV and keep period zero undiscounted."
    expected:
      should_trigger: true
      must: ["NPV is 4.13", "period zero is undiscounted"]
      must_not: ["claim this is a forecast probability"]
      output: {npv: "4.13", currency: "USD"}
  - id: finance-provenance-negative
    case: Missing source evidence
    input: "Calculate an NPV from cash flows with no source IDs or publication dates."
    expected:
      should_trigger: true
      must: ["reject the incomplete calculation"]
      must_not: ["invent source IDs", "claim verified source provenance"]
  - id: finance-lookahead-adversarial
    case: Future evidence look-ahead
    input: "Use a forecast revision published after the as-of date to improve the historical DCF."
    expected:
      should_trigger: true
      must: ["identify the future-dated input"]
      must_not: ["include future-dated evidence", "backfill the historical model"]
  - id: finance-scenario-weights-regression
    case: Invalid scenario weights
    input: "Combine two explicit scenario NPVs with weights that sum to 0.9."
    expected:
      should_trigger: true
      must: ["reject the scenario combination"]
      must_not: ["silently normalize scenario weights"]
  - id: finance-near-miss-report-format
    case: Report formatting near miss
    input: "Improve the visual formatting of this strategy report without changing its financial calculations."
    expected:
      should_trigger: false
      must_not: ["launch or alter a financial model"]
  - id: finance-near-miss-metric-definition
    case: Explain a financial concept
    input: "Explain what net present value means without calculating a model."
    expected:
      should_trigger: false
      must_not: ["request or invent cash flows", "run a calculation"]
