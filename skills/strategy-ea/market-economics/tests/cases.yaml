cases:
  - id: market-reconciliation-golden
    case: Keep market estimates distinct
    input: |
      Reconcile the supplied sourced top-down and bottom-up market estimates and calculate segment SAM/SOM and whitespace.
      All values below are synthetic test inputs, not business forecasts. Periods are equally spaced annual periods where applicable. Use only this supplied evidence.
      Input JSON:
      {
        "as_of": "2026-01-31",
        "currency": "USD",
        "top_down": {
          "value": "1000",
          "source_id": "top",
          "published_at": "2026-01-01"
        },
        "bottom_up": {
          "value": "1200",
          "source_id": "bottom",
          "published_at": "2026-01-01"
        },
        "currently_served": {
          "value": "20",
          "source_id": "served",
          "published_at": "2026-01-01"
        },
        "segments": [
          {
            "id": "smb",
            "annual_spend": {
              "value": "100",
              "source_id": "spend",
              "published_at": "2026-01-01"
            },
            "serviceable_share": {
              "value": "0.5",
              "source_id": "fit",
              "published_at": "2026-01-01"
            },
            "attainable_share": {
              "value": "0.2",
              "source_id": "capture",
              "published_at": "2026-01-01"
            }
          },
          {
            "id": "enterprise",
            "annual_spend": {
              "value": "200",
              "source_id": "spend2",
              "published_at": "2026-01-01"
            },
            "serviceable_share": {
              "value": "0.25",
              "source_id": "fit2",
              "published_at": "2026-01-01"
            },
            "attainable_share": {
              "value": "0.1",
              "source_id": "capture2",
              "published_at": "2026-01-01"
            }
          }
        ]
      }
    expected: {should_trigger: true, must: ["keep top-down and bottom-up estimates separate", "show the reconciliation difference"], must_not: ["silently average the estimates"]}
  - id: market-missing-source-negative
    case: No evidence for market size
    input: "Estimate TAM for a new AI product without any supplied market sources."
    expected: {should_trigger: true, must: ["request missing inputs", "avoid inventing TAM"], must_not: ["present an unsupported estimate as fact"]}
  - id: market-no-segment-near-miss
    case: Segment sizing lacks evidence
    input: "Calculate serviceable segment size when no segment needs or shares have been supplied."
    expected: {should_trigger: true, must: ["request the missing segment evidence"], must_not: ["fabricate segment shares"]}
  - id: market-transferability-adversarial
    case: Transferability without evidence
    input: "Apply a European market share directly to another geography despite no local evidence."
    expected: {should_trigger: true, must: ["flag transferability as unproven"], must_not: ["assume local demand is identical"]}
  - id: market-future-source-regression
    case: Future source date
    input: "Use evidence published after the as-of date in a historical sizing model."
    expected: {should_trigger: true, must: ["reject future-dated evidence"], must_not: ["include look-ahead data"]}
  - id: market-competitor-near-miss
    case: Competitor research
    input: "Compare named competitors and their positioning."
    expected: {should_trigger: false, must_not: ["perform market-sizing arithmetic"]}
  - id: market-research-near-miss
    case: Qualitative market trend research
    input: "Summarize the supplied market trend sources without estimating market size."
    expected: {should_trigger: false, must_not: ["invent TAM or segment shares"]}

